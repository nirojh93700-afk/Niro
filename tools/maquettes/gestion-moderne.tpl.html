<title>Gestion Niv Création</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
<style>
/* Mise en page : barre latérale encre (sections + raccourcis), contenu sur papier chaud,
   chaque section = un en-tête + des sous-onglets ; or réservé aux actions et à l'état actif. */
:root{
  --paper:#f8f5ef; --surface:#ffffff; --sunk:#f2ece1; --line:#e6ddcd; --line-2:#d9cdb8;
  --ink:#1c160d; --muted:#6c6253; --faint:#958a77;
  --gold:#c9a24b; --gold-2:#a98935; --gold-ink:#7c6120; --gold-bg:#f6ecd4;
  --side:#18120a; --side-2:#231b10; --side-line:#33291b; --side-fg:#efe6d4; --side-muted:#a2957d;
  --ok:#2d7347; --ok-bg:#e3f1e7; --warn:#9a5c10; --warn-bg:#fbeed6; --bad:#ad3326; --bad-bg:#fbe3df; --info:#355b86; --info-bg:#e2eaf4;
  --shadow:0 1px 2px rgba(28,22,13,.06),0 4px 16px rgba(28,22,13,.05);
  --pop:0 12px 40px rgba(28,22,13,.22);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-title:"Playfair Display",Georgia,"Times New Roman",serif;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13100b; --surface:#1c1710; --sunk:#241e15; --line:#332a1d; --line-2:#433826;
  --ink:#f2eadb; --muted:#ab9e88; --faint:#857a67;
  --gold:#d4ae58; --gold-2:#c9a24b; --gold-ink:#e2c67e; --gold-bg:#33291a;
  --side:#0d0a06; --side-2:#18130c; --side-line:#2a2217; --side-fg:#efe6d4; --side-muted:#9a8d75;
  --ok:#7cc796; --ok-bg:#16301f; --warn:#e6b25e; --warn-bg:#382810; --bad:#f08b7d; --bad-bg:#3a1a15; --info:#8fb2dc; --info-bg:#172537;
  --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13100b; --surface:#1c1710; --sunk:#241e15; --line:#332a1d; --line-2:#433826;
  --ink:#f2eadb; --muted:#ab9e88; --faint:#857a67;
  --gold:#d4ae58; --gold-2:#c9a24b; --gold-ink:#e2c67e; --gold-bg:#33291a;
  --side:#0d0a06; --side-2:#18130c; --side-line:#2a2217; --side-fg:#efe6d4; --side-muted:#9a8d75;
  --ok:#7cc796; --ok-bg:#16301f; --warn:#e6b25e; --warn-bg:#382810; --bad:#f08b7d; --bad-bg:#3a1a15; --info:#8fb2dc; --info-bg:#172537;
  --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.app.mini{grid-template-columns:68px minmax(0,1fr)}

/* ---------- barre latérale ---------- */
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 12px 12px;overflow-y:auto;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.brand img{height:34px;width:auto;border-radius:6px;background:#fbf7ee}
.brand b{font-weight:600;font-size:13px;letter-spacing:.02em}
.brand small{display:block;color:var(--side-muted);font-size:11.5px}
.sfind{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--side-line);background:var(--side-2);color:var(--side-muted);border-radius:9px;padding:8px 10px;text-align:left}
.sfind:hover{color:var(--side-fg);border-color:#4a3d28}
.sfind span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:11px;border:1px solid var(--side-line);border-radius:5px;padding:1px 5px;color:var(--side-muted)}
.slabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.slabel button{background:none;border:0;color:var(--side-muted);font-size:11px;letter-spacing:0;text-transform:none;padding:0}
.nav{display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-fg);padding:8px 10px;border-radius:8px;text-align:left;text-decoration:none;font-size:13.5px}
.ni:hover{background:var(--side-2)}
.ni.on{background:var(--side-2);box-shadow:inset 2px 0 0 var(--gold)}
.ni.on .ico{color:var(--gold)}
.ni .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#1c160d;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.badge.red{background:#d9553f;color:#fff}
.sub{display:flex;flex-direction:column;margin:2px 0 6px 28px;border-left:1px solid var(--side-line)}
.sub button{background:none;border:0;color:var(--side-muted);text-align:left;padding:5px 10px;font-size:12.5px;border-radius:0 6px 6px 0}
.sub button:hover{color:var(--side-fg)}
.sub button.on{color:var(--side-fg);box-shadow:inset 2px 0 0 var(--gold)}
.pins{display:flex;flex-direction:column;gap:1px}
.pins .ni{font-size:12.8px;color:#d9ceb8;padding:6px 10px}
.pins .ico{width:15px;height:15px;color:var(--side-muted)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--side-line)}
.app.mini .side .t,.app.mini .side .slabel,.app.mini .side .sub,.app.mini .side .brand div,.app.mini .side .sfind span,.app.mini .side .kbd,.app.mini .side .pins,.app.mini .side .badge{display:none}
.app.mini .ni,.app.mini .sfind{justify-content:center;padding:9px}

/* ---------- haut ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink);position:relative}
.ibtn:hover{border-color:var(--line-2)}
.ibtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#d9553f;border:2px solid var(--surface)}
.ai{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ai .ico{color:var(--gold)}
.menu-btn{display:none}
.note{margin:14px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));padding:9px 12px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note a{color:var(--gold-ink);font-weight:600}

/* ---------- page ---------- */
.page{padding-block:18px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph h1{font-family:var(--f-title);font-weight:600;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.ph .grow{flex:1;min-width:240px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--gold-2)}
.btn.pri{background:linear-gradient(180deg,#d4b05c,#bf9640);border-color:#ad8835;color:#1c160d;font-weight:600}
.btn.pri:hover{filter:brightness(1.04)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--gold-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab .badge{height:18px;min-width:18px;font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>h2,.card .ch{font-size:14px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ch .grow{flex:1}
.ch a,.lnk{color:var(--gold-ink);font-weight:500;font-size:12.5px;text-decoration:none;background:none;border:0;padding:0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center}
.up{color:var(--ok)} .down{color:var(--bad)}
.spark{width:100%;height:34px;margin-top:4px}
.spark path.a{fill:var(--gold-bg);stroke:none}
.spark path.l{fill:none;stroke:var(--gold-2);stroke-width:1.6}
.spark circle{fill:var(--gold-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--sunk);color:var(--ink);font-weight:600}

/* tâches */
.todo{list-style:none;margin:0;padding:6px}
.todo li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}
.todo li:hover{background:var(--sunk)}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-weight:600}
.todo .tx span{color:var(--muted);font-size:12.5px}
.t-bad .ic{background:var(--bad-bg);color:var(--bad)} .t-warn .ic{background:var(--warn-bg);color:var(--warn)} .t-info .ic{background:var(--info-bg);color:var(--info)} .t-ok .ic{background:var(--ok-bg);color:var(--ok)} .t-gold .ic{background:var(--gold-bg);color:var(--gold-ink)}

/* tableaux */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--gold-bg) 45%,transparent)}
td.r,th.r{text-align:right}
.ref{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--gold-bg);color:var(--gold-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.th{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.sub2{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-prep{background:var(--warn-bg);color:var(--warn)} .p-grav{background:var(--info-bg);color:var(--info)} .p-exp{background:var(--ok-bg);color:var(--ok)} .p-liv{background:var(--sunk);color:var(--muted)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-gold{background:var(--gold-bg);color:var(--gold-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;background:var(--surface)}
.chip.x{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.views{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.vchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vchip i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.75}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:0 10px;height:34px;background:var(--surface);min-width:0}
.search input{border:0;background:none;outline:0;min-width:0;width:180px}
.bulk{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--ink);color:var(--paper);border-radius:10px;flex-wrap:wrap}
.bulk .btn{background:transparent;color:var(--paper);border-color:#5a4b33}
.cb{width:16px;height:16px;accent-color:var(--gold-2)}
.stock-in{width:62px;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-2);border-radius:3px}
.bar.low i{background:var(--warn)} .bar.out i{background:var(--bad)}
.tg{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ok)} .tg.on::after{left:16px}

/* messagerie */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 260px;min-height:560px}
.ilist{border-right:1px solid var(--line);overflow-y:auto}
.im{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-top:0;border-right:0;width:100%;text-align:left}
.im:hover{background:var(--sunk)}
.im.on{background:var(--gold-bg)}
.im .tx{flex:1;min-width:0}
.im b{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.im b small{font-weight:400;color:var(--muted)}
.im p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im .u{width:8px;height:8px;border-radius:50%;background:var(--gold-2);margin-top:6px;flex:none}
.thread{display:flex;flex-direction:column;min-width:0}
.thread header{padding:14px 18px;border-bottom:1px solid var(--line)}
.thread header h3{margin:0;font-size:15px}
.msgs{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.msg{max-width:62ch;padding:12px 14px;border-radius:12px;background:var(--sunk);overflow-wrap:anywhere;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--gold-bg)}
.msg small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px}
.draft{border:1px solid var(--gold);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.draft .h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--gold-ink)}
.draft textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);resize:vertical;line-height:1.55}
.ctx{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;font-size:13px}
.ctx h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* cartes matériel */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:14px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--sunk);max-width:100%}
.mcard .top2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mcard b{font-weight:600}

/* graphique */
.chart{width:100%;height:240px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ca{fill:var(--gold-bg);stroke:var(--gold-2);stroke-width:1}
.chart .ben{fill:var(--gold-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 16px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* réglages */
.set{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.setnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.setnav button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted)}
.setnav button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:16px}
.fs{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.fs .d h3{margin:0 0 4px;font-size:14px}
.fs .d p{margin:0;color:var(--muted);font-size:12.8px}
.fields{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;font-weight:600}
.fld input,.fld select{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);min-width:0;width:100%}
.fld small{color:var(--muted);font-size:12px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:12px;box-shadow:var(--pop);flex-wrap:wrap}
.savebar .btn{border-color:#5a4b33;background:transparent;color:var(--paper)}
.savebar .btn.pri{background:linear-gradient(180deg,#d4b05c,#bf9640);color:#1c160d;border-color:#ad8835}

/* plan */
.princ{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pc{padding:16px;display:flex;flex-direction:column;gap:6px}
.pc h3{margin:0;font-size:14.5px;display:flex;gap:8px;align-items:center}
.pc h3 .ico{color:var(--gold-2)}
.pc p{margin:0;color:var(--muted);font-size:13px}
.pc small{color:var(--faint);font-size:11.5px}
.same{color:var(--ok);font-weight:600}
.moved{color:var(--gold-ink);font-weight:600}

/* aperçu d'écran conservé */
.keep{padding:20px;display:flex;flex-direction:column;gap:12px}
.keep h3{margin:0;font-size:16px}
.keep p{margin:0;color:var(--muted);max-width:70ch}
.skel{display:grid;gap:10px}
.skel i{display:block;height:12px;border-radius:6px;background:var(--sunk)}

/* tiroir, palette, panneaux */
.scrim{position:fixed;inset:0;background:rgba(18,13,6,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:70;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--pop);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.drawer:not(.on),.sheet:not(.on){box-shadow:none;visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{margin:0;font-size:17px;flex:1}
.db{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0}
.steps li{flex:1;text-align:center;font-size:11.5px;color:var(--faint);position:relative;padding-top:18px}
.steps li::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--line-2);transform:translateX(-50%);z-index:1}
.steps li::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.steps li:first-child::after{display:none}
.steps li.done{color:var(--ink)} .steps li.done::before,.steps li.done::after{background:var(--gold-2)}
.steps li.now{color:var(--gold-ink);font-weight:600} .steps li.now::before{background:var(--surface);border:3px solid var(--gold-2);width:12px;height:12px;top:3px}
.steps li.now::after{background:var(--gold-2)}
.engr{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.engr div{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid var(--line)}
.engr div:last-child{border-bottom:0}
.engr span{padding:8px 12px}
.engr span:first-child{background:var(--sunk);color:var(--muted);font-size:12.5px}
.alertbox{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:600;display:flex;gap:8px;align-items:center}
.pal{position:fixed;top:12vh;left:50%;transform:translate(-50%,-8px);width:min(640px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);z-index:80;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;display:flex;flex-direction:column;max-height:70vh}
.pal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.pal .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal .pin input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.pal .res{overflow-y:auto;padding:6px}
.pal .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.pal .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left}
.pal .it .t{flex:1;min-width:0}
.pal .it small{color:var(--muted)}
.pal .it.sel{background:var(--gold-bg)}
.pal .ft{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}
.pal .ft .kbd{border-color:var(--line);color:var(--muted)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:70;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--pop);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bub{padding:10px 12px;border-radius:12px;background:var(--sunk);max-width:90%;line-height:1.55}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.prop{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 12px;background:var(--paper);min-width:0}
.pop{position:absolute;top:44px;right:0;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);z-index:40;padding:6px;text-align:left;color:var(--ink)}
.pop .todo li{padding:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:90;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ico{color:var(--gold)}

/* onglets téléphone */
.mtabs{display:none}

@media (max-width:1100px){
  .g2{grid-template-columns:1fr}
  .inbox{grid-template-columns:260px minmax(0,1fr)}
  .ctx{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){

  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:75;transform:translateX(-102%);transition:transform .22s;height:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .side.on{transform:none}

  .menu-btn{display:inline-flex}
  .collapse{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .note{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ph h1{font-size:24px}
  .g3{grid-template-columns:1fr}
  .set{grid-template-columns:1fr}
  .setnav{position:static;flex-direction:row;overflow-x:auto}
  .setnav button{white-space:nowrap}
  .fs{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .inbox .thread{display:none}
  .inbox.open .ilist{display:none} .inbox.open .thread{display:flex}
  .hide-m{display:none}
  .ai .t{display:none}
  .mtabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mtabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--muted);font-size:11px;position:relative}
  .mtabs button.on{color:var(--ink);font-weight:600}
  .mtabs button.on .ico{color:var(--gold-2)}
  .mtabs .badge{position:absolute;top:3px;left:calc(50% + 6px);height:17px;min-width:17px;font-size:10.5px}
  .search input{width:120px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:20px}
  .crumb span.hide-s{display:none}
  .pop{position:fixed;left:12px;right:12px;width:auto;top:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function head(title, sub, acts = "") { return `<div class="ph"><div class="grow"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="acts">${acts}</div></div>`; }
function tabsBar(s) { return s.tabs.length > 1 ? `<div class="tabs" role="tablist">${s.tabs.map((t) => `<button class="tab ${tabOf(s) === t.id ? "on" : ""}" role="tab" type="button" data-go="${s.id}:${t.id}">${esc(t.t)}${t.badge ? `<span class="badge">${t.badge}</span>` : ""}</button>`).join("")}</div>` : ""; }
function spark(pts) { const w = 160, h = 34, mx = Math.max(...pts), mn = Math.min(...pts); const xy = pts.map((v, i) => [i * w / (pts.length - 1), h - 3 - (v - mn) / ((mx - mn) || 1) * (h - 8)]); const l = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "); const e = xy[xy.length - 1]; return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="a" d="${l} L${w} ${h} L0 ${h}Z"/><path class="l" d="${l}"/><circle cx="${e[0]}" cy="${e[1]}" r="2.5"/></svg>`; }
function img(k) { return IMG[k] ? `<img class="th" src="${IMG[k]}" alt="">` : `<span class="th"></span>`; }

function render() {
  const page = document.getElementById("page");
  const crumb = document.getElementById("crumb");
  if (state.sec === "plan") { page.innerHTML = vPlan(); crumb.innerHTML = `<b>Ce qui change</b>`; }
  else {
    const s = secOf(state.sec); const t = tabOf(s);
    page.innerHTML = VIEWS[s.id](s, t);
    const T = s.tabs.find((x) => x.id === t);
    crumb.innerHTML = s.tabs.length > 1 ? `<span class="hide-s">${esc(s.t)}</span><span class="hide-s">›</span><b>${esc(T.t)}</b>` : `<b>${esc(s.t)}</b>`;
  }
  renderSide();
  window.scrollTo(0, 0);
}

function go(key) {
  if (key === "plus") { openSide(true); return; }
  const [s, t] = key.split(":");
  if (s === "plan") { state.sec = "plan"; }
  else if (secOf(s)) { state.sec = s; if (t) state.tab[s] = t; state.open[s] = true; const k = s + ":" + tabOf(secOf(s)); state.recents = [k, ...state.recents.filter((x) => x !== k)].slice(0, 6); }
  state.sel.clear(); state.mailOpen = false;
  if (location.hash !== "#" + state.sec) history.replaceState(null, "", "#" + state.sec);
  openSide(false); closeAll(); render();
}

/* ---------- palette ⌘K ---------- */
let palSel = 0, palItems = [];
function palData(q) {
  const n = (x) => x.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const Q = n(q.trim());
  const ecr = SECTIONS.flatMap((s) => s.tabs.map((t) => ({ k: s.id + ":" + t.id, t: t.t, s: s.t + (t.old !== t.t ? " · avant : " + t.old : ""), ic: s.ic, g: "Écrans" })));
  ecr.push({ k: "plan", t: "Ce qui change", s: "Où va chaque écran", ic: "map", g: "Écrans" });
  const act = [["commandes:etiquettes", "Imprimer les étiquettes d'adresse", "print"], ["commandes:devis", "Créer un devis", "plus"], ["catalogue:produits", "Ajouter un produit", "plus"], ["messages:envois", "Écrire à une cliente", "mail"], ["marketing:promos", "Créer un code promo", "tag"], ["stock:achats", "Déposer une facture fournisseur", "box"]].map(([k, t, ic]) => ({ k, t, s: "Action", ic, g: "Actions" }));
  const cmd = ORDERS.map((o) => ({ o: o.ref, t: o.ref + " · " + o.nom, s: o.art, ic: "orders", g: "Commandes" }));
  const all = [...act, ...ecr, ...cmd];
  return Q ? all.filter((x) => n(x.t + " " + x.s).includes(Q)) : [...act.slice(0, 4), ...ecr.filter((e) => state.pins.includes(e.k)), ...cmd.slice(0, 3)];
}
function renderPal() {
  palItems = palData(document.getElementById("palIn").value);
  if (palSel >= palItems.length) palSel = 0;
  let g = "";
  document.getElementById("palRes").innerHTML = palItems.length ? palItems.map((x, i) => { const h = x.g !== g ? `<div class="grp">${x.g}</div>` : ""; g = x.g; return h + `<button type="button" class="it ${i === palSel ? "sel" : ""}" data-pi="${i}">${I(x.ic)}<span class="t">${esc(x.t)}<br><small>${esc(x.s)}</small></span>${I("arrow")}</button>`; }).join("") : `<div class="grp">Aucun résultat</div>`;
}
function openPal() { closeAll(); const p = document.getElementById("pal"); p.classList.add("on"); scrim.classList.add("on"); const i = document.getElementById("palIn"); i.value = ""; palSel = 0; renderPal(); setTimeout(() => i.focus(), 30); }
function runPal(i) { const x = palItems[i]; if (!x) return; if (x.o) { closeAll(); openOrder(x.o); } else go(x.k); }

/* ---------- événements ---------- */
document.addEventListener("click", (e) => {
  const el = (sel) => e.target.closest(sel);
  let x;
  if ((x = el("[data-close]"))) { closeAll(); return; }
  if ((x = el("[data-pi]"))) { runPal(+x.dataset.pi); return; }
  if ((x = el("[data-sel]")) || (x = el("#all"))) {
    if (x.id === "all") { ORDERS.forEach((o) => x.checked ? state.sel.add(o.ref) : state.sel.delete(o.ref)); }
    else x.checked ? state.sel.add(x.dataset.sel) : state.sel.delete(x.dataset.sel);
    render(); return;
  }
  if ((x = el("[data-go]"))) { go(x.dataset.go); return; }
  if ((x = el("[data-order]"))) { openOrder(x.dataset.order); return; }
  if ((x = el("[data-view]"))) { state.view = x.dataset.view; render(); return; }
  if ((x = el("[data-mail]"))) { state.mail = +x.dataset.mail; state.mailOpen = true; render(); return; }
  if (el("[data-backmail]")) { state.mailOpen = false; render(); return; }
  if (el("[data-clear]")) { state.sel.clear(); render(); return; }
  if ((x = el("[data-set]"))) { state.setTab = x.dataset.set; render(); return; }
  if ((x = el("[data-tg]"))) { x.classList.toggle("on"); if (x.hasAttribute("data-dirty")) dirty(); else toast(x.classList.contains("on") ? "Activé" : "Désactivé"); return; }
  if (el("[data-cancel]")) { render(); return; }
  if (el("[data-saveall]")) { document.getElementById("savebar").hidden = true; toast("Réglages enregistrés"); return; }
  if ((x = el("[data-toast]"))) { toast(x.dataset.toast); return; }
  if (el("#openPal") || el("#topFind")) { openPal(); return; }
  if (el("#aiBtn")) { closeAll(); openAssistant(); return; }
  if (el("#menuBtn")) { openSide(true); return; }
  if (el("#collapse")) { document.getElementById("app").classList.toggle("mini"); save(); return; }
  if (el("#editPins")) { const k = state.sec + ":" + (secOf(state.sec) ? tabOf(secOf(state.sec)) : ""); if (label(k)) { state.pins = state.pins.includes(k) ? state.pins.filter((p) => p !== k) : [...state.pins, k].slice(-5); save(); renderSide(); toast(state.pins.includes(k) ? "Écran épinglé" : "Retiré des raccourcis"); } return; }
  if (el("#bell")) { const p = document.getElementById("bellPop"); p.hidden = !p.hidden; if (!p.hidden) p.innerHTML = `<ul class="todo"><li class="t-bad"><span class="ic">${I("bolt")}</span><span class="tx"><b>Commande Express</b><span>3K7QX2LM · il y a 2 h</span></span></li><li class="t-gold"><span class="ic">${I("mail")}</span><span class="tx"><b>Camille R. a répondu</b><span>10 h 12</span></span></li><li class="t-warn"><span class="ic">${I("box")}</span><span class="tx"><b>Sac blanc et or presque épuisé</b><span>4 restants</span></span></li></ul>`; return; }
  if (el("#scrim")) { closeAll(); openSide(false); return; }
  const tr = el("tbody tr[data-order]"); if (tr && !el("input")) { openOrder(tr.dataset.order); return; }
});
function dirty() { const b = document.getElementById("savebar"); if (b) { b.hidden = false; } }
document.addEventListener("input", (e) => {
  if (e.target.id === "palIn") { palSel = 0; renderPal(); }
  if (e.target.matches("[data-dirty]")) dirty();
  if (e.target.classList.contains("stock-in")) { clearTimeout(dirty.h); dirty.h = setTimeout(() => toast("Stock enregistré"), 700); }
});
document.addEventListener("keydown", (e) => {
  const pal = document.getElementById("pal").classList.contains("on");
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal ? closeAll() : openPal(); return; }
  if (e.key === "Escape") { closeAll(); openSide(false); return; }
  if (pal) {
    if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); renderPal(); }
    if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPal(); }
    if (e.key === "Enter") { e.preventDefault(); runPal(palSel); }
    return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); openPal(); return; }
  if (e.key.toLowerCase() === "g") { keydown.g = Date.now(); return; }
  if (keydown.g && Date.now() - keydown.g < 900) { const m = { c: "commandes", m: "messages", p: "catalogue", a: "accueil", f: "finances", s: "stock" }[e.key.toLowerCase()]; keydown.g = 0; if (m) go(m); }
});
function keydown() {}

function fromHash() { const h = location.hash.replace("#", ""); if (h === "plan" || secOf(h)) { state.sec = h; } render(); }
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
