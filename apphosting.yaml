# =============================================================================
# Firebase App Hosting — configuration du site Niv Création
# -----------------------------------------------------------------------------
# Ce fichier n'est utilisé QUE par Firebase App Hosting. Netlify l'ignore.
# Les secrets (clés Stripe, Resend…) sont à créer dans Google Secret Manager
# (la console Firebase propose de les créer au moment de la connexion du dépôt).
# =============================================================================

runConfig:
  # Économie maximale : 0 instance quand personne ne visite (aucun coût à vide).
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Interrupteur de stockage : Firestore au lieu de Netlify Blobs ---------
  - variable: DATA_BACKEND
    value: firestore
    availability:
      - RUNTIME

  # --- Variables publiques ----------------------------------------------------
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://nivcreation.fr
    availability:
      - BUILD
      - RUNTIME

  # --- Secrets (à créer dans Secret Manager : console Firebase → App Hosting) -
  # availability: RUNTIME uniquement → les secrets ne sont pas lus pendant le
  # build (next build n'en a pas besoin), seulement au démarrage du serveur.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
    availability:
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
    availability:
      - RUNTIME
  - variable: CONTACT_EMAIL
    secret: CONTACT_EMAIL
    availability:
      - RUNTIME
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
  - variable: ANTHROPIC_MODEL
    secret: ANTHROPIC_MODEL
    availability:
      - RUNTIME
  # --- Recherche web gratuite pour l'étude de marché (Tavily) -----------------
  - variable: TAVILY_API_KEY
    secret: TAVILY_API_KEY
    availability:
      - RUNTIME
