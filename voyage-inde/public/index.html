    go.forEach(function(c){ A.push('<tr><td>'+catIcon(c)+' '+esc(catLabel(c))+'</td><td class="n">'+rvE(g[c])+'</td></tr>'); });
    A.push('<tr class="tot"><td>'+esc(t("exportShareTotal"))+'</td><td class="n">'+rvE(b.part)+'</td></tr>');
    if(b.paid>0.005) A.push('<tr><td class="muted">'+esc(t("pdAlreadyPaid"))+'</td><td class="n neg">− '+rvE(b.paid)+'</td></tr>');
    if(b.rb>0.005) A.push('<tr><td class="muted">'+esc(t("pdAlreadyReimb"))+'</td><td class="n neg">− '+rvE(b.rb)+'</td></tr>');
    if(b.rc>0.005) A.push('<tr><td class="muted">'+esc(t("exportReceived"))+'</td><td class="n">+ '+rvE(b.rc)+'</td></tr>');
    var s=b.solde; A.push('<tr class="tot"><td>'+esc(s>0.005?t("pdRemains"):(s<-0.005?t("exportToGetUp"):t("exportEvenUp")))+'</td><td class="n '+(s>0.005?"pos":"neg")+'">'+(Math.abs(s)>0.005?rvE(Math.abs(s)):"—")+'</td></tr></table></div>'); });
  // 7 corbeille (dépenses)
  var trash=trashItems().filter(function(it){return it.kind!=="pay";});
  A.push('<h2>7. '+esc(t("exportS7"))+'</h2><table><tr><th>'+esc(t("dateW"))+'</th><th>'+esc(t("forWhat"))+'</th><th>'+esc(t("whoPaid"))+'</th><th class="n">'+esc(t("amount"))+'</th><th>'+esc(t("exportDeletedWhen"))+'</th></tr>');
  trash.forEach(function(it){ var x=it.item; A.push('<tr class="del"><td>'+rvD(x.ts)+'</td><td>'+esc(x.hotel?(x.hotel+(x.label?" — "+x.label:"")):(x.label||t("exportNoName")))+'</td><td>'+esc(x.who)+'</td><td class="n">'+rvE(x.eur)+'</td><td class="tag muted">'+rvDH(it.tAt)+(it.tBy?' · '+esc(it.tBy):'')+'</td></tr>'); });
  if(!trash.length) A.push('<tr><td colspan="5" class="muted">'+esc(t("trashEmpty"))+'</td></tr>');
  A.push('</table>');
  // 8 qui doit à qui
  var tr=settlements();
  A.push('<h2>8. '+esc(t("exportS8"))+'</h2>');
  if(tr.length){ A.push('<table><tr><th>'+esc(t("exportFrom"))+'</th><th>'+esc(t("exportTo"))+'</th><th class="n">'+esc(t("exportLeft"))+'</th></tr>'); var tt=0;
    tr.forEach(function(o){ tt+=o.amount; A.push('<tr><td><span class="dot" style="background:'+col(o.from)+'"></span><b>'+esc(o.from)+'</b></td><td><span class="dot" style="background:'+col(o.to)+'"></span><b>'+esc(o.to)+'</b></td><td class="n pos">'+rvE(o.amount)+'</td></tr>'); });
    A.push('<tr class="tot"><td colspan="2">TOTAL</td><td class="n">'+rvE(tt)+'</td></tr></table>'); }
  else A.push('<p class="neg">'+esc(t("settleAllSquare"))+'</p>');
  A.push('<div class="note">'+esc(t("exportFooter"))+' '+nowTxt+' — '+esc(t("exportIST"))+'</div>');
  // chaque tableau dans un cadre défilant : la page ne déborde jamais de l'écran du téléphone
  return A.join("").replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
}
/* Export : le PDF peut être produit en FRANÇAIS, ANGLAIS ou TAMOUL (boutons dans la barre),
   quelle que soit la langue de l'appli. On bascule LANG le temps de construire le document. */
var EXPORT_LANGS=[["fr","Français"],["en","English"],["ta","தமிழ்"]];
function openExport(lang){
  lang = (lang && I18N[lang]) ? lang : LANG;
  var saved=LANG; LANG=lang;
  var doc, title, labels;
  try { doc=buildReport(); title=t("exportTitle"); labels={close:t("exportClose"), open:t("exportOpen"), pdf:t("exportSavePdf"), hint:t("exportHint"), fail:t("exportOpenFail")}; }
  finally { LANG=saved; }
  var rv=$("reportView");
  var langBar=EXPORT_LANGS.map(function(L){ return '<button type="button" class="rvLang'+(L[0]===lang?' on':'')+'" data-l="'+L[0]+'">'+L[1]+'</button>'; }).join("");
  rv.innerHTML=RV_CSS+'<div class="rv-bar noprint"><button id="rvClose">✕ '+esc(labels.close)+'</button><button id="rvOpen">↗️ '+esc(labels.open)+'</button><button class="pri" id="rvPrint">🖨️ '+esc(labels.pdf)+'</button>'+
      '<div class="rv-langs">'+langBar+'</div></div>'+
    '<div class="note noprint" style="margin:10px 14px 0">'+esc(labels.hint)+'</div><div class="rv-doc" lang="'+lang+'">'+doc+'</div>';
  rv.hidden=false; document.body.style.overflow="hidden"; rv.scrollTop=0;
  $("rvClose").addEventListener("click", function(){ rv.hidden=true; rv.innerHTML=""; document.body.style.overflow=""; });
  $("rvPrint").addEventListener("click", function(){ window.print(); });
  [].forEach.call(rv.querySelectorAll(".rvLang"), function(b){ b.addEventListener("click", function(){ openExport(b.dataset.l); }); });
  $("rvOpen").addEventListener("click", function(){
    var html='<!doctype html><html lang="'+lang+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title>'+RV_CSS.replace('#reportView{position:fixed;inset:0;z-index:9999;','#reportView{')+'</head><body><div id="reportView"><div class="rv-doc" lang="'+lang+'">'+doc+'</div></div></body></html>';
    try{ var b=new Blob([html],{type:"text/html"}), u=URL.createObjectURL(b); var w=window.open(u,"_blank"); if(!w) location.href=u; }catch(e){ toast(labels.fail); }
  });
}
$("exportBtn").addEventListener("click", function(){ openExport(); });

/* ---- sync live : relit régulièrement quand l'onglet Dépenses est ouvert ---- */
function tick(){
  if(document.hidden) return;
  if(!$("scD").classList.contains("on")) return;
  if($("sheet").classList.contains("on")) return;      // pas pendant une saisie
  // une saisie n'a pas pu partir (réseau coupé) ? on la renvoie d'abord, sinon on relit
  (SYNC.pending ? saveTrip() : pullTrip()).then(renderExp).catch(function(){});
}
setInterval(tick, 7000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });
window.addEventListener("online", function(){
  (SYNC.pending ? saveTrip() : pullTrip()).then(renderExp).catch(function(){});
});

/* ---- service worker (hors ligne + installation) ----
   MISE À JOUR AUTOMATIQUE : dès qu'une nouvelle version est en ligne, l'app se recharge
   toute seule (plus besoin de fermer/rouvrir plusieurs fois sur iPhone). */
if("serviceWorker" in navigator){
  var _reloading=false, _hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!_hadCtrl){ _hadCtrl=true; return; }           // 1re installation : pas de rechargement inutile
    if(_reloading) return; _reloading=true;           // nouvelle version installée -> on recharge une fois
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update().catch(function(){});
      setInterval(function(){ reg.update().catch(function(){}); }, 60000);        // vérifie toutes les minutes
      document.addEventListener("visibilitychange", function(){                  // et à chaque retour dans l'app
        if(!document.hidden) reg.update().catch(function(){});
      });
    }).catch(function(){});
  });
}

/* récupère les hôtels saisis dans l'ancien gestionnaire (S.hotels) vers les dépenses normales */
function migrateHotels(){
  if(!S.hotels || !S.hotels.length) return false;
  var changed=false;
  S.hotels.forEach(function(h){
    (h.rooms||[]).forEach(function(r){
      if(!(r.eur>0)) return;
      var id="H_"+h.id+"_"+r.id;
      if(S.expenses.some(function(x){return x.id===id;})) return;
      S.expenses.push({ id:id, ts:h.ts||Date.now(), who:r.paidBy||(S.me||S.people[0]),
        hotel:h.name||"", label:r.label||"", amount:r.price, cur:r.cur||"EUR", eur:r.eur, cat:"hotel",
        split:{mode:"equal", among:(r.occupants&&r.occupants.length)?r.occupants:S.people.slice()},
        hidden:!h.revealed, mt:Date.now() });
      changed=true;
    });
    if(h.id && S.deleted.indexOf("H:"+h.id)<0) S.deleted.push("H:"+h.id);
  });
  S.hotels=[];
  return changed;
}

/* ========== démarrage ========== */
/* lien de partage ?c=<code> : la famille rejoint direct le même carnet (un seul appui) */
try{
  var _q=(location.search||"")+(location.hash||"");
  var _cm=_q.match(/[?&#]c=([A-Za-z0-9_-]{3,})/);
  if(_cm && _cm[1]){
    var _c=_cm[1].toLowerCase();
    if(_c!==lget("voyageCode")){ lset("voyageCode", _c); localStorage.removeItem("tripCache"); }
    if(history.replaceState) history.replaceState(null,"",location.pathname);   // nettoie l'URL
  }
}catch(_e){}
var savedLang = lget("lang"); if(savedLang && I18N[savedLang]) LANG=savedLang;
applyLang(LANG);                                   // pose les libellés traduits + premier rendu
loadAll().then(function(){ if(migrateHotels()){ cacheTrip(); saveTrip().catch(function(){}); } applyLang(LANG); });
})();
