<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B2224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voyage Inde">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Convertisseur de devises hors ligne et carnet de dépenses partagé pour le voyage en Inde du Sud.">
<title>Voyage — Inde du Sud</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js"></script>
<style>
  :root{
    --ink:#0B2224; --slab:#12383A; --slab2:#0F2C2E;
    --line:rgba(233,242,238,.14); --line2:rgba(233,242,238,.07);
    --text:#EDF5F1; --muted:#89ACA6;
    --gold:#F0B429; --aqua:#6FD6C4; --rose:#E58C7D;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{background:var(--ink); min-height:100%}
  body{
    margin:0; min-height:100dvh; background:var(--ink); color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  .wrap{max-width:460px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}

  /* ---- tabs ---- */
  .tabs{flex:none; display:flex; gap:4px; padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 0}
  .tabs button{
    flex:1; font:inherit; font-size:12px; font-weight:600; letter-spacing:0;
    color:var(--muted); background:var(--slab2); border:1px solid var(--line);
    padding:11px 0; border-radius:12px; cursor:pointer; transition:.18s;
  }
  .tabs button[aria-selected="true"]{background:var(--slab); color:var(--text); border-color:rgba(233,242,238,.3)}
  .tabs .langbtn{flex:none; width:auto; color:var(--muted); font-size:12px; font-weight:600; padding:11px 12px}
  .tabs .langbtn .car{font-size:9px}
  .tabs button:focus-visible{outline:2px solid var(--aqua); outline-offset:2px}

  .screen{flex:1; display:none; flex-direction:column; min-height:0}
  .screen.on{display:flex}
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 8px}

  /* ---- converter slab ---- */
  .slab{flex:none; background:var(--slab); border:1px solid var(--line); border-radius:20px; overflow:hidden}
  .side{padding:14px 16px 15px; cursor:pointer; border:0; background:none; width:100%; text-align:left; font:inherit; color:inherit; display:block; transition:background .2s}
  .side.active{background:rgba(255,255,255,.045)}
  .side:focus-visible{outline:2px solid var(--aqua); outline-offset:-3px}
  .side .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
  .lbl{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .cur-btn{
    font:inherit; font-size:13px; font-weight:600; color:var(--text);
    background:var(--slab2); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  }
  .cur-btn .car{color:var(--muted); font-size:10px}
  .num{
    font-family:"Bricolage Grotesque", ui-sans-serif, sans-serif;
    font-variation-settings:"wdth" 82,"opsz" 96; font-weight:500;
    font-size:clamp(32px,10.5vw,44px); line-height:1.05; font-variant-numeric:tabular-nums;
    color:#fff; overflow:hidden; white-space:nowrap; direction:ltr;
  }
  .side.active .num{color:var(--gold)}
  .side:not(.active) .num{color:var(--aqua); opacity:.9}
  .caret{display:inline-block; width:3px; height:.8em; margin-left:3px; background:currentColor; vertical-align:-2px; animation:bk 1.05s steps(1,end) infinite}
  @keyframes bk{50%{opacity:0}}

  .spine{position:relative; height:1px; background:var(--line); margin:0 16px}
  .swap{position:absolute; right:0; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%;
        background:var(--slab2); border:1px solid var(--line); color:var(--text); display:grid; place-items:center; cursor:pointer; z-index:2}
  .swap svg{width:16px; height:16px; transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
  .swap.turn svg{transform:rotate(180deg)}

  .rate{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px 12px; background:var(--slab2); border-top:1px solid var(--line)}
  .rate .v{font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums}
  .rate .v small{display:block; color:var(--muted); font-size:10px; font-weight:400; margin-top:2px}
  .chip{font:inherit; font-size:11.5px; font-weight:500; color:var(--muted); background:none; border:1px solid var(--line); border-radius:999px; padding:6px 11px; cursor:pointer}
  .chip:active{color:var(--text)}
  .chip.on{background:var(--gold); color:#0B2224; border-color:transparent}
  .rate .acts{display:flex; gap:6px; flex:none}

  .tip{font-size:12px; color:var(--muted); line-height:1.5; margin:12px 2px 0}
  .tip b{color:var(--text); font-weight:600}

  h2.sec{font:inherit; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:18px 2px 8px; font-weight:600}
  .refs{list-style:none; margin:0; padding:0}
  .refs li{display:flex; justify-content:space-between; gap:12px; padding:7px 2px; font-size:13px; border-bottom:1px solid var(--line2)}
  .refs li span:first-child{color:#C8DAD5}
  .refs .p{color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500}
  .refs .p em{font-style:normal; color:var(--muted); font-size:11.5px; margin-left:6px}

  /* ---- keypad ---- */
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0; margin:8px 0 4px}
  .pad button{
    font-family:"Bricolage Grotesque", sans-serif; font-variation-settings:"wdth" 85; font-size:22px; color:var(--text);
    background:var(--slab); border:1px solid var(--line); border-radius:14px; padding:13px 0; cursor:pointer; touch-action:manipulation;
  }
  .pad button:active{background:#1A4A4A; transform:scale(.97)}
  .pad .fn{color:var(--muted); font-size:18px}

  /* ---- expenses ---- */
  .hero{background:var(--slab); border:1px solid var(--line); border-radius:20px; padding:16px}
  .hero .lbl{margin-bottom:4px}
  .hero .big{font-family:"Bricolage Grotesque",sans-serif; font-variation-settings:"wdth" 82; font-weight:600; font-size:40px; line-height:1; color:#fff; font-variant-numeric:tabular-nums}
  .hero .sub{font-size:12px; color:var(--muted); margin-top:8px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .btn{
    font:inherit; font-size:14px; font-weight:600; width:100%;
    background:var(--gold); color:#0B2224; border:0; border-radius:14px; padding:14px; cursor:pointer; margin-top:12px;
  }
  .btn.ghost{background:none; color:var(--text); border:1px solid var(--line)}
  .btn:active{opacity:.85}

  .person{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line2)}
  .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .person .nm{flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .person .amt{font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:600}
  .person .bal{font-size:11px; font-variant-numeric:tabular-nums; width:76px; text-align:right; flex:none}
  .pchip{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; border-radius:999px; padding:4px 10px; flex:none; white-space:nowrap}
  .pchip.due{background:rgba(240,120,120,.16); color:var(--rose); border:1px solid rgba(240,120,120,.35)}
  .pchip.ok{background:rgba(90,215,200,.14); color:var(--aqua); border:1px solid rgba(90,215,200,.3)}
  .pchip.zero{background:var(--slab2); color:var(--muted); border:1px solid var(--line)}
  .pos{color:var(--aqua)} .neg{color:var(--rose)}
  .bar{height:3px; background:var(--line2); border-radius:2px; margin-top:5px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:2px}

  .exp{display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line2)}
  .exp .body{flex:1; min-width:0}
  .exp .t{font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .exp .s{font-size:11px; color:var(--muted); margin-top:2px}
  .exp .r{text-align:right; flex:none}
  .exp .r b{font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; display:block}
  .exp .r small{font-size:10.5px; color:var(--muted)}
  .del{background:none; border:0; color:var(--muted); font-size:17px; padding:4px 2px 4px 8px; cursor:pointer}

  .empty{text-align:center; color:var(--muted); font-size:13px; line-height:1.6; padding:26px 10px}

  /* ---- sheet ---- */
  .sheet-bg{position:fixed; inset:0; background:rgba(4,16,17,.6); backdrop-filter:blur(3px); z-index:40; display:none}
  .sheet-bg.on{display:block}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:460px; margin:0 auto;
    background:#123A3C; border:1px solid var(--line); border-bottom:0; border-radius:22px 22px 0 0;
    padding:8px 16px calc(18px + var(--safe)); max-height:88dvh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y;
    transform:translateY(101%); transition:transform .28s cubic-bezier(.3,1,.4,1);
  }
  .sheet.on{transform:none}
  /* fenêtre ouverte : on bloque le défilement de l'écran derrière (évite le blocage iOS) */
  body.sheetopen .scroll{overflow:hidden}
  .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 14px}
  .sheet h3{font:inherit; font-size:16px; font-weight:600; margin:0 0 14px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .field input, .field select{
    width:100%; font:inherit; font-size:16px; color:var(--text);
    background:var(--slab2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; -webkit-appearance:none; appearance:none;
  }
  /* iOS ne zoome que sous 16px : tous les champs saisissables forcés à 16px (empêche le zoom auto) */
  input, select, textarea{ font-size:16px !important }
  .field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 17px) 20px, calc(100% - 12px) 20px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .field input:focus, .field select:focus{outline:none; border-color:var(--aqua)}
  .row2{display:grid; grid-template-columns:1.6fr 1fr; gap:10px}
  .who{display:flex; flex-wrap:wrap; gap:7px}
  .who button{font:inherit; font-size:13px; color:var(--text); background:var(--slab2); border:1px solid var(--line); border-radius:999px; padding:8px 13px; cursor:pointer}
  .who button[aria-pressed="true"]{background:var(--gold); color:#0B2224; border-color:transparent; font-weight:600}
  .curlist{list-style:none; margin:0; padding:0}
  .curlist li button{
    width:100%; display:flex; align-items:center; gap:12px; font:inherit; font-size:14.5px; color:var(--text);
    background:none; border:0; border-bottom:1px solid var(--line2); padding:13px 4px; cursor:pointer; text-align:left;
  }
  .curlist .code{font-weight:600; width:44px; flex:none}
  .curlist .nm{flex:1; color:var(--muted); font-size:13px}
  .curlist .sy{font-family:"Bricolage Grotesque",sans-serif; font-size:16px; color:var(--gold)}
  .note{font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:2px}
  .toast{position:fixed; left:50%; bottom:calc(24px + var(--safe)); transform:translateX(-50%) translateY(20px); opacity:0;
    background:#EDF5F1; color:#0B2224; font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px; z-index:60; transition:.25s; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%)}
  /* ---- planning ---- */
  .phead{background:var(--slab); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px}
  .phead .t{font-family:"Bricolage Grotesque",sans-serif; font-variation-settings:"wdth" 82; font-weight:600; font-size:22px; color:#fff; line-height:1.1}
  .phead .dt{font-size:12px; color:var(--muted); margin-top:4px}
  .ptoday{margin-top:12px; background:var(--slab2); border:1px solid rgba(240,180,41,.4); border-radius:14px; padding:11px 12px; font-size:13px; line-height:1.4}
  .ptoday b{color:var(--gold)}
  .pbar{height:4px; background:var(--line2); border-radius:2px; margin-top:10px; overflow:hidden}
  .pbar i{display:block; height:100%; background:var(--gold); border-radius:2px; transition:width .3s}
  .pday{background:var(--slab); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px}
  .pday.now{border-color:var(--gold)}
  .pday .top{display:flex; align-items:flex-start; gap:10px}
  .pday .num{flex:none; font-family:"Bricolage Grotesque",sans-serif; font-weight:600; color:var(--gold); font-size:12px; letter-spacing:.04em; min-width:50px; padding-top:2px}
  .pday .dd{flex:1; min-width:0}
  .pday .ttl{font-size:14px; font-weight:600; color:var(--text)}
  .pday .date{font-size:11px; color:var(--muted); margin-top:1px}
  .pday .desc{font-size:12.5px; color:#C8DAD5; line-height:1.5; margin-top:7px}
  .pday .drive{display:inline-block; font-size:11px; color:var(--gold); background:rgba(240,180,41,.12); border-radius:999px; padding:2px 9px; margin-top:7px}
  .pchk{flex:none; width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line); background:var(--slab2); color:var(--gold); display:grid; place-items:center; cursor:pointer; font-size:14px; padding:0}
  .pchk.on{background:var(--gold); border-color:transparent; color:#0B2224}
  .pmap{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--aqua); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; margin:8px 6px 0 0}
  .pover{list-style:none; margin:0; padding:0}
  .pover li{display:flex; justify-content:space-between; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line2); font-size:13px}
  .pover .pl{color:#C8DAD5} .pover .pl small{color:var(--muted); font-size:11px; display:block; margin-top:1px}
  .pover .nn{color:var(--gold); font-size:11.5px; white-space:nowrap; flex:none}
  .plegs{list-style:none;margin:0;padding:0}
  .plegs li{display:flex; justify-content:space-between; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line2); font-size:12.5px}
  .plegs .du{color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap}
  .ptips{margin:0; padding-left:18px} .ptips li{font-size:12.5px; color:#C8DAD5; line-height:1.5; margin-bottom:6px}
  #planMap{height:260px; border-radius:16px; overflow:hidden; margin-bottom:12px; background:var(--slab2)}
  .leaflet-container{font:inherit; background:var(--slab2)}
  .mk{width:26px; height:26px; border-radius:50%; background:var(--slab); border:2px solid var(--gold); color:var(--gold); font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:12px; line-height:22px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,.45)}
  .mk.now{background:var(--gold); color:#0B2224}
  .pphoto{width:100%; height:150px; object-fit:cover; border-radius:12px; margin:2px 0 8px; display:block}
  .pcredit{font-size:11px; color:var(--muted); text-align:center; margin:6px 2px 24px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="tabs" role="tablist">
    <button id="tabC" role="tab" aria-selected="true" data-i18n="conv">Convertisseur</button>
    <button id="tabD" role="tab" aria-selected="false" data-i18n="dep">Dépenses</button>
    <button id="tabP" role="tab" aria-selected="false" data-i18n="planTab">Planning</button>
    <button id="langBtn" class="langbtn" aria-label="Langue">FR <span class="car">▾</span></button>
  </div>

  <!-- ===== CONVERTISSEUR ===== -->
  <section class="screen on" id="scC">
    <div class="scroll">
      <div class="slab">
        <button class="side active" id="sideA">
          <span class="top"><span class="lbl" data-i18n="iEnter">Je saisis</span>
            <span class="cur-btn" id="curA">INR <span class="car">▾</span></span></span>
          <div class="num" id="numA">0</div>
        </button>
        <div class="spine">
          <button class="swap" id="swap" aria-label="Inverser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M17 20V4M17 4l3 3"/></svg>
          </button>
        </div>
        <button class="side" id="sideB">
          <span class="top"><span class="lbl" data-i18n="itMakes">Ça fait</span>
            <span class="cur-btn" id="curB">EUR <span class="car">▾</span></span></span>
          <div class="num" id="numB">0</div>
        </button>
        <div class="rate">
          <div class="v" id="rateTxt">—<small id="rateSrc"></small></div>
          <div class="acts">
            <button class="chip" id="editRate">Modifier</button>
            <button class="chip" id="fetchRate" data-i18n="refresh">Actualiser</button>
          </div>
        </div>
      </div>

      <p class="tip" id="tip"></p>

      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="," class="fn">,</button><button data-k="0">0</button>
        <button data-k="del" class="fn" aria-label="Effacer">⌫</button>
      </div>

      <h2 class="sec" id="refTitle">Est-ce cher ?</h2>
      <ul class="refs" id="refList"></ul>
    </div>
  </section>

  <!-- ===== DÉPENSES ===== -->
  <section class="screen" id="scD">
    <div class="scroll">
      <div class="hero">
        <div class="top" style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px">
          <span class="lbl" data-i18n="totalTrip">Total du voyage</span>
          <span class="cur-btn" id="expCurBtn">EUR <span class="car">▾</span></span>
        </div>
        <div class="big" id="grandTotal">0,00 €</div>
        <div class="sub">
          <span id="expCount">0 dépense</span>
          <span id="perHead">—</span>
        </div>
      </div>
      <div id="lockBanner"></div>
      <button class="btn" id="addExp" data-i18n="addExp">+ Ajouter une dépense</button>
      <button class="btn ghost" id="roomsBtn" style="margin-top:8px; font-size:13px; padding:11px">🛏️ <span data-i18n="roomsBtnLbl">Assistant Chambres</span></button>
      <button class="btn ghost" id="driverBtn" style="margin-top:8px; font-size:13px; padding:11px">🚗 <span data-i18n="driverBtnLbl">Chauffeur du circuit</span></button>

      <h2 class="sec" data-i18n="whoSpent">Qui a dépensé quoi</h2>
      <div id="byPerson"></div>
      <button class="btn ghost" id="managePeople" style="margin-top:10px; font-size:13px; padding:11px" data-i18n="managePeople">Gérer les participants</button>

      <h2 class="sec" id="catHead" data-i18n="catTitle">Par catégorie</h2>
      <div id="byCat"></div>

      <h2 class="sec" data-i18n="history">Historique</h2>
      <div id="history"></div>

      <button class="btn ghost" id="hotelsBtn" style="margin-top:16px">🏨 <span data-i18n="hotelsBtnLbl">Hôtels (privé)</span></button>
      <button class="btn ghost" id="settleBtn" style="margin-top:8px">🔒 <span data-i18n="settleBtnLbl">Qui rembourse qui (privé)</span></button>
      <button class="btn ghost" id="lockBtn" style="margin-top:8px">Verrouiller les comptes</button>
      <button class="btn ghost" id="trashBtn" style="margin-top:8px;font-size:13px;padding:11px">🗑️ Corbeille</button>
      <button class="btn" id="exportBtn" style="margin-top:8px">📄 Exporter tout en PDF</button>
      <button class="btn" id="syncBtn" style="margin-top:8px" data-i18n="sync">Synchroniser</button>
      <div class="row2" style="margin-top:8px">
        <button class="btn ghost" id="sendBtn" style="margin:0; font-size:13px; padding:12px" data-i18n="sendExp">Envoyer mes dépenses</button>

/* ========== stockage ==========
   fx (taux) + me (identité) -> localStorage (hors ligne, propre au téléphone)
   trip (carnet)             -> carnet en ligne partagé (kvdb), rangé par code de voyage
   Fusion sûre à plusieurs : union par id + tombstones (aucune saisie ne disparaît).
   Repli hors ligne : cache localStorage, ré-émis tout seul au retour du réseau.        */
/* Stockage en ligne = Firebase Realtime Database (projet « voyage-inde », plan gratuit).
   Tous les téléphones qui saisissent le MÊME code de voyage lisent/écrivent le même carnet.
   Synchro automatique : relecture régulière (tick) + écriture à chaque changement.
   Repli hors ligne : cache localStorage, ré-émis tout seul au retour du réseau. */
var FBDB = "https://voyage-inde-default-rtdb.europe-west1.firebasedatabase.app";
var DEFAULT_CODE = "inde26-4h7k2p";                    // code de voyage par défaut (partagé)
var SYNC = { ok:false, tried:false, pending:false };

function lget(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

function tripCode(){ var c=lget("voyageCode"); if(!c){ c=DEFAULT_CODE; lset("voyageCode", c); } return c; }
function tripURL(){ return FBDB + "/carnets/" + encodeURIComponent(tripCode()) + ".json"; }
function shareLink(){ return location.origin + location.pathname + "?c=" + encodeURIComponent(tripCode()); }
/* extrait un code de voyage depuis un lien (?c=…) ou un code collé tel quel */
function parseCode(s){
  s=(s||"").trim(); if(!s) return "";
  var m=s.match(/[?&#]c=([A-Za-z0-9_-]{3,})/);
  if(m) return m[1].toLowerCase();
  return s.toLowerCase().replace(/[^a-z0-9_-]/g,"");
}

function saveRates(){ lset("fx", {r:RATES, s:RSRC}); }

/* fusion anti-écrasement : union par id, retire les supprimés (tombstones) */
function mergeDoc(remote){
  if(!remote || typeof remote!=="object") return;
  // suppressions : « dernier qui agit gagne » (delAt vs undelAt) ; anciens tombstones sans date = 1
  var delAt={}, undelAt={};
  var mx=function(dst,src){ if(src&&typeof src==="object"){ Object.keys(src).forEach(function(k){ var v=+src[k]||0; if(v>(dst[k]||0)) dst[k]=v; }); } };
  mx(delAt,S.delAt); mx(delAt,remote.delAt); mx(undelAt,S.undelAt); mx(undelAt,remote.undelAt);
  (S.deleted||[]).concat(remote.deleted||[]).forEach(function(id){ if(id && !delAt[id]) delAt[id]=1; });
  S.delAt=delAt; S.undelAt=undelAt;
  var del={}; Object.keys(delAt).forEach(function(id){ if(delAt[id]>(undelAt[id]||0)) del[id]=1; });
  // corbeille : union, l'entrée la plus récente gagne
  var tr={}; [S.trash, remote.trash].forEach(function(src){ if(src&&typeof src==="object"){ Object.keys(src).forEach(function(k){ var tt=src[k]; if(tt&&tt.item){ var e=tr[k]; if(!e||(+tt.tAt||0)>=(+e.tAt||0)) tr[k]=tt; } }); } });
  S.trash=tr;
  var by={};  (S.expenses||[]).concat(remote.expenses||[]).forEach(function(x){ if(x&&x.id){ var e=by[x.id]; if(!e || (+x.mt||0)>=(+e.mt||0)) by[x.id]=x; } });
  var exp=[]; for(var id in by){ if(!del[id]) exp.push(by[id]); }
  S.expenses=exp; S.deleted=Object.keys(del);
  var order=(S.people||[]).slice();
  (remote.people||[]).forEach(function(p){ if(p && order.indexOf(p)<0) order.push(p); });
  S.people=order;
  var rAt=+remote.lockAt||0, lAt=+S.lockAt||0;   // verrou : dernier qui agit gagne
  if(rAt>lAt){ S.locked=!!remote.locked; S.lockedBy=remote.lockedBy||""; S.lockAt=rAt; }
  // hôtels : union par id, on garde le plus récent (ts) ; tombstones "H:"+id
  var hby={};
  (S.hotels||[]).concat(remote.hotels||[]).forEach(function(h){ if(h&&h.id){ var e=hby[h.id]; if(!e || (+h.ts||0)>=(+e.ts||0)) hby[h.id]=h; } });
  var hout=[]; for(var hid in hby){ if(!del["H:"+hby[hid].id]) hout.push(hby[hid]); }
  S.hotels=hout;
  // remboursements : union par id ; tombstones "P:"+id
  // remboursements : on garde la version la plus RÉCEMMENT modifiée (mt), sinon une correction serait écrasée
  var pby={}; (S.payments||[]).concat(remote.payments||[]).forEach(function(p){ if(p&&p.id){ var pe=pby[p.id]; if(!pe || (+p.mt||0)>=(+pe.mt||0)) pby[p.id]=p; } });
  var pout=[]; for(var pid in pby){ if(!del["P:"+pid]) pout.push(pby[pid]); }
  S.payments=pout;
  // code secret privé (partagé) : le plus récent gagne
  if((+remote.pinAt||0) > (+S.pinAt||0)){ S.pinHash=remote.pinHash||""; S.pinAt=+remote.pinAt||0; }
  // parts par personne (couple/individuel) : fusion (les valeurs locales priment si présentes)
  if(remote.partShares && typeof remote.partShares==="object"){ var mps={}; Object.keys(remote.partShares).forEach(function(k){mps[k]=remote.partShares[k];}); Object.keys(S.partShares||{}).forEach(function(k){mps[k]=S.partShares[k];}); S.partShares=mps; }
}
function localDoc(){ return {people:S.people, expenses:S.expenses, deleted:S.deleted||[],
  locked:!!S.locked, lockedBy:S.lockedBy||"", lockAt:+S.lockAt||0, hotels:S.hotels||[], payments:S.payments||[],
  pinHash:S.pinHash||"", pinAt:+S.pinAt||0, partShares:S.partShares||{},
  trash:S.trash||{}, delAt:S.delAt||{}, undelAt:S.undelAt||{}, updatedAt:Date.now()}; }
function cacheTrip(){ lset("tripCache", localDoc()); }

/* ===== CORBEILLE : une suppression garde son détail et peut être restaurée =====
   Règle de fusion « dernier qui agit gagne » : un id est supprimé si delAt[id] > undelAt[id].
   Les anciens tombstones (liste `deleted` sans date) valent delAt=1 -> restaurables. */
function isDeletedId(id){
  var d=(S.delAt&&+S.delAt[id])||((S.deleted||[]).indexOf(id)>=0?1:0);
  var u=(S.undelAt&&+S.undelAt[id])||0;
  return d>u;
}
function trashExpense(x){
  if(!x||!x.id) return;
  var now=Date.now();
  S.trash=S.trash||{}; S.delAt=S.delAt||{};
  S.trash[x.id]={kind:"exp", item:JSON.parse(JSON.stringify(x)), tAt:now, tBy:S.me||""};
  S.delAt[x.id]=now;
  if(S.deleted.indexOf(x.id)<0) S.deleted.push(x.id);
  S.expenses=S.expenses.filter(function(y){ return y.id!==x.id; });
}
function trashPayment(p){
  if(!p||!p.id) return;
  var now=Date.now(), key="P:"+p.id;
  S.trash=S.trash||{}; S.delAt=S.delAt||{};
  S.trash[key]={kind:"pay", item:JSON.parse(JSON.stringify(p)), tAt:now, tBy:S.me||""};
  S.delAt[key]=now;
  if(S.deleted.indexOf(key)<0) S.deleted.push(key);
  S.payments=(S.payments||[]).filter(function(q){ return q.id!==p.id; });
}
/* ce qui est ACTUELLEMENT supprimé et dont on a le détail, du plus récent au plus ancien */
function trashItems(){
  var out=[], tr=S.trash||{};
  Object.keys(tr).forEach(function(k){ var tt=tr[k]; if(tt&&tt.item&&isDeletedId(k)) out.push({key:k, kind:tt.kind, item:tt.item, tAt:+tt.tAt||0, tBy:tt.tBy||""}); });
  out.sort(function(a,b){ return b.tAt-a.tAt; });
  return out;
}
function restoreFromTrash(key){
  var tt=(S.trash||{})[key]; if(!tt||!tt.item) return false;
  var now=Date.now();
  S.undelAt=S.undelAt||{}; S.undelAt[key]=now;
  S.deleted=(S.deleted||[]).filter(function(id){ return id!==key; });
  var it=JSON.parse(JSON.stringify(tt.item)); it.mt=now;
  if(tt.kind==="pay"){ S.payments=(S.payments||[]).filter(function(q){return q.id!==it.id;}); S.payments.push(it); }
  else { S.expenses=S.expenses.filter(function(y){return y.id!==it.id;}); S.expenses.push(it); }
  return true;
}

/* y a-t-il de vraies données sur cet appareil ? */
function hasRealData(){ return (S.expenses&&S.expenses.length) || (S.hotels&&S.hotels.length) || (S.people&&S.people.length>1); }

/* lit le carnet en ligne ; replie sur le cache local si hors ligne */
function pullTrip(){
  return fetch(tripURL(), {headers:{Accept:"application/json"}, cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      return r.json();                                  // null = carnet encore vide en ligne
    })
    .then(function(d){
      SYNC.ok=true; SYNC.tried=true; if(d) mergeDoc(d); cacheTrip();
      // carnet vide en ligne mais plein sur ce téléphone -> on l'envoie tout de suite
      if(!d && hasRealData()) saveTrip().catch(function(){});
      // chambres remises en proportion du prix réel payé -> on enregistre si ça a bougé
      else if(alignHotelsToPaid()){ cacheTrip(); saveTrip().catch(function(){}); }
    })
    .catch(function(){
      SYNC.tried=true; SYNC.ok=false;                   // hors ligne / réseau coupé
      var c=lget("tripCache"); if(c && !hasRealData()) mergeDoc(c);
    });
}

/* écrit le carnet : relit -> fusionne -> écrit.
   SÉCURITÉ : si la RELECTURE échoue (réseau coupé), on n'écrit PAS — sinon un téléphone
   mal connecté remplacerait le carnet complet par le sien. La saisie est gardée en local
   et repart toute seule au retour du réseau (SYNC.pending). */
function saveTrip(){
  cacheTrip();
  var url=tripURL();
  return fetch(url, {headers:{Accept:"application/json"}, cache:"no-store"})
    .then(function(r){ if(!r || !r.ok) throw new Error("read"); return r.json(); })
    .then(function(remote){ if(remote) mergeDoc(remote);   // null = carnet vide en ligne (normal)
      return fetch(url, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(localDoc())});
    })
    .then(function(r){ if(!r || !r.ok) throw new Error("write"); SYNC.ok=true; SYNC.pending=false; cacheTrip(); })
    .catch(function(){ SYNC.pending=true; SYNC.ok=false; cacheTrip(); throw new Error("offline"); });
}

/* rejoindre le carnet de la famille (lien ?c=… ou code collé) */
function joinCarnet(raw){
  var c=parseCode(raw);
  if(!c){ toast(t("tCodeEmpty")); return false; }
  if(c===tripCode()) return true;
  lset("voyageCode", c); localStorage.removeItem("tripCache");
  return true;
}

function loadAll(){
  var fx=lget("fx"); if(fx&&fx.r){ for(var k in fx.r) RATES[k]=fx.r[k]; if(fx.s) RSRC=fx.s; }
  loadFixedRates(); applyFixedRates();          // le taux fixe reprend TOUJOURS le dessus
  var me=lget("me"); if(me&&me.name) S.me=me.name;
  var ec=lget("expCur"); if(ec&&CUR[ec]) S.expCur=ec;
  var c=lget("tripCache"); if(c){ mergeDoc(c); alignHotelsToPaid(); }   // affichage immédiat, même hors ligne
  return pullTrip();
}

/* ========== convertisseur ========== */
function fmtBuf(s){
  var p=String(s).split(",");
  var i=new Intl.NumberFormat("fr-FR").format(parseInt(p[0]||"0",10));
  return p.length>1 ? i+","+p[1] : i;
}
function renderConv(){

  $("tip").innerHTML=tp;

  else{
    var oc = rc===S.a ? S.b : S.a;
    $("refTitle").style.display=""; $("refTitle").textContent=t(R.tkey);

      return "<li><span>"+esc(t(x[0]))+"</span><span class='p'>"+nf(x[1],0)+"–"+nf(x[2],0)+" "+CUR[rc].s+
             "<em>"+nf(lo,lo<10?2:0)+"–"+nf(hi,hi<10?2:0)+" "+CUR[oc].s+"</em></span></li>";
    }).join("");

function key(k){
  var tgt = S.mode==="rate" ? "rbuf" : "buf";
  var s = S[tgt];
  var maxd = S.mode==="rate" ? 4 : CUR[S.typing==="a"?S.a:S.b].d;
  if(k==="del"){ s = s.length>1 ? s.slice(0,-1) : (S.mode==="rate"?"":"0"); }
  else if(k===","){ if(maxd===0) return; if(s.indexOf(",")<0) s=(s===""?"0":s)+","; }
  else {
    var dec=s.split(",")[1];
    if(dec && dec.length>=maxd) return;
    if(s.replace(/[^0-9]/g,"").length>=10) return;
    s = (s==="0") ? k : s+k;
  }
  S[tgt]=s; renderConv();
}

}

];
var CATMAP={}; CATS.forEach(function(c){ CATMAP[c.k]=c; });
function catOf(k){ return CATMAP[k]||CATMAP.other; }
function catIcon(k){ return catOf(k).i; }
function catLabel(k){ var c=catOf(k); return c[LANG]||c.fr; }
/* nom d'un hôtel (regroupe les chambres) + libellé affiché (masqué si caché) */
function hotelKey(x){ return (x.cat==="hotel") ? (x.hotel || x.label || "?") : null; }
function displayLabel(x){

/* nombre de nuits entre deux dates "YYYY-MM-DD" (0 si incomplet) */
function nightsBetween(inV,outV){ if(!inV||!outV) return 0; var n=Math.round((new Date(outV+"T12:00:00")-new Date(inV+"T12:00:00"))/86400000); return n>0?n:0; }
function nightsLabel(n){ return n>1 ? fmt(t("planNights"),{n:n}) : (n===1 ? t("planNight1") : ""); }
/* "du 8 au 10 sept" à partir d'un ts d'arrivée + nb de nuits */
function stayRange(ts,nights){
  if(!ts) return "";
  var d1=new Date(ts), loc=locale();
  if(!nights) return d1.toLocaleDateString(loc,{day:"2-digit",month:"short"});
  var d2=new Date(ts+nights*86400000);
  var sameMonth=d1.getMonth()===d2.getMonth();
  var a=d1.toLocaleDateString(loc,sameMonth?{day:"2-digit"}:{day:"2-digit",month:"short"});
  var b=d2.toLocaleDateString(loc,{day:"2-digit",month:"short"});
  return fmt(t("stayFromTo"),{a:a,b:b});
}

function color(name){ var i=S.people.indexOf(name); return PALETTE[(i<0?0:i)%PALETTE.length]; }

/* nombre de parts d'une personne (couple = 2, individuel = 1). Défaut 1. */
function sharesOf(p){ var n=(S.partShares && +S.partShares[p]) || 1; return n>0?n:1; }

/* part due (en €) d'une personne pour une dépense, selon la répartition choisie */
function owedShare(x, person){
  var sp=x.split;
  if(!sp || sp.mode==="equal"){
    var among=(sp && sp.among && sp.among.length) ? sp.among : S.people.slice();
    if(!among.length) among=[x.who];
    if(among.indexOf(person)<0) return 0;
    // répartition PONDÉRÉE par les parts (couple = 2, individuel = 1)
    var tot=0; among.forEach(function(p){ tot+=sharesOf(p); });
    if(tot<=0) return 0;
    return x.eur * sharesOf(person)/tot;
  }
  if(sp.mode==="exact"){ return +((sp.amounts&&sp.amounts[person])||0); }
  if(sp.mode==="shares"){
    var tot=0, sh=sp.shares||{}, k; for(k in sh) tot+=(+sh[k]||0);
    if(tot<=0) return 0;
    return (+sh[person]||0)>0 ? x.eur*(+sh[person])/tot : 0;
  }
  return 0;
}
/* chambres d'hôtel -> dépenses virtuelles (nom masqué tant que non révélé) */
function hotelRoomExpenses(){
  var out=[];
  (S.hotels||[]).forEach(function(h){
    (h.rooms||[]).forEach(function(r){
      if(!(r.eur>0)) return;
      out.push({ id:"H_"+h.id+"_"+r.id, ts:h.ts||0, who:r.paidBy||(S.me||S.people[0]),
        label: h.revealed ? (h.name+(r.label?" — "+r.label:"")) : ("🎁 "+t("hotelSurprise")),
        amount:r.price, cur:r.cur||"EUR", eur:r.eur, cat:"hotel",
        split:{mode:"equal", among:(r.occupants&&r.occupants.length)?r.occupants:S.people.slice()},
        _hotel:true, _hidden:!h.revealed });
    });
  });
  return out;
}
/* Dépenses COMPTÉES. Un hôtel MASQUÉ n'existe pas encore pour les comptes : ses chambres sont
   exclues partout (totaux, parts, qui doit quoi, fiches, export) tant qu'il n'est pas révélé.
   Rien n'est supprimé : tout reste dans S.expenses et dans l'écran privé Hôtels. */
function isHiddenHotel(x){ return !!(x && ((x.cat==="hotel" && x.hidden) || (x._hotel && x._hidden))); }
function EXP(){ return S.expenses.concat(hotelRoomExpenses()).filter(function(x){ return !isHiddenHotel(x); }); }

/* payé + dû + noms concernés */
function balances(){
  var all=EXP();
  var set={}; S.people.forEach(function(p){ set[p]=1; });
  all.forEach(function(x){ if(x.who) set[x.who]=1;
    var sp=x.split; if(sp){ (sp.among||[]).forEach(function(p){set[p]=1;});
      if(sp.amounts) Object.keys(sp.amounts).forEach(function(p){set[p]=1;});
      if(sp.shares) Object.keys(sp.shares).forEach(function(p){set[p]=1;}); } });
  var names=Object.keys(set), paid={}, owed={};
  names.forEach(function(p){ paid[p]=0; owed[p]=0; });
  all.forEach(function(x){ paid[x.who]=(paid[x.who]||0)+x.eur;
    names.forEach(function(p){ owed[p]=(owed[p]||0)+owedShare(x,p); }); });
  return {names:names, paid:paid, owed:owed};
}
/* effet des remboursements déjà faits sur les soldes */
function paymentAdj(){
  var adj={};
  (S.payments||[]).forEach(function(p){ if(!p) return; adj[p.from]=(adj[p.from]||0)+(+p.eur||0); adj[p.to]=(adj[p.to]||0)-(+p.eur||0); });
  return adj;
}
/* qui rembourse qui : minimise le nombre de transferts (glouton) */
/* QUI REMBOURSE QUI — RÈGLE DE LA GÉRANTE (11/09/2026) : TOUT PASSE PAR ELLE.
   C'est elle (1er participant) qui avance tout : chacun lui rembourse ce qu'il doit ; si quelqu'un
   a donné plus que sa part, c'est elle qui lui rendra la différence. Jamais de virement entre deux
   autres personnes (plus de « Amma Appa doit à Mama »). */
function settlements(){
  var B=balances(), adj=paymentAdj();
  var hub=S.people[0]; if(!hub) return [];
  var out=[];
  B.names.forEach(function(p){ if(p===hub) return;
    var v=(B.paid[p]||0)-(B.owed[p]||0)+(adj[p]||0);       // >0 : on lui doit · <0 : il doit
    if(v<-0.01) out.push({from:p, to:hub, amount:-v});
    else if(v>0.01) out.push({from:hub, to:p, amount:v});
  });
  out.sort(function(a,b){ return b.amount-a.amount; });
  return out;
}

function renderExp(){
  var B=balances(), adj=paymentAdj();
  var names=B.names.slice().filter(function(p){ return S.people.indexOf(p)>=0 || B.paid[p]>0 || B.owed[p]>0; });

  }).join("")+'<p class="note" style="margin:8px 2px 0;text-align:center">'+t("pdTapHint")+'</p>' : '<p class="empty">'+t("emptyPeople")+'</p>';

  // récap par catégorie
  var byC={}; all.forEach(function(x){ var k=(x.cat&&CATMAP[x.cat])?x.cat:"other"; byC[k]=(byC[k]||0)+x.eur; });

  var canDel=function(x){ return !S.locked && !x._hotel; };   // la gérante peut modifier/supprimer toute dépense (pas les chambres d'hôtel virtuelles)
  // Les hôtels sont RANGÉS À PART (bouton « Hôtels ») -> une seule ligne récap ici, le reste dans l'historique
  var hotelsAll = all.filter(function(x){ return x.cat==="hotel"; });
  var others = all.filter(function(x){ return x.cat!=="hotel"; }).sort(function(a,b){return b.ts-a.ts});
  var hotelSummary = "";
  if(hotelsAll.length){
    var hSum=0, hNights=0, hKeys={}, hMin=8e15;
    hotelsAll.forEach(function(x){ hSum+=x.eur; var k=hotelKey(x); if(k && !hKeys[k]){ hKeys[k]=1; hNights+=(+x.nights||0); } if((x.ts||0)&&x.ts<hMin) hMin=x.ts; });

    hotelSummary = '<button id="hotelSummary" class="exp" style="width:100%;text-align:left;background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);cursor:pointer">'+

      '<div class="body"><div class="t">'+t("hotelsTitle")+'</div>'+
      '<div class="s">'+nH+' 🏨'+(hNights?' · '+hNights+' '+t("nightsWord"):'')+' · '+t("tapToOpen")+'</div></div>'+
      '<div class="r"><b>'+mc(hSum)+'</b></div><span style="width:18px;flex:none;color:var(--muted)">›</span></button>';
  }

    if(ex){

      var cur=S.expenses.filter(function(y){ return y.id===ex.id; })[0] || ex;

        ts:d, who:sel, label:$("fLbl").value.trim(), amount:v, cur:c, eur:conv(v,c,"EUR"), cat:selCat, split:split, mt:Date.now() });

    closeSheet(); renderExp();
    pullThenSave();

/* ---- transmission par code (marche sans réseau partagé) ---- */
function b64e(s){ var b=new TextEncoder().encode(s), o=""; for(var i=0;i<b.length;i++) o+=String.fromCharCode(b[i]); return btoa(o); }
function b64d(s){ var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return new TextDecoder().decode(a); }

function makeCode(){
  var mine = S.me ? S.expenses.filter(function(x){return x.who===S.me}) : S.expenses;
  if(!mine.length) return null;
  var pack = mine.map(function(x){ return [x.id, x.ts, x.who, x.label||"", +x.amount.toFixed(2), x.cur, +x.eur.toFixed(2), x.cat||"other", x.split||null, x.hotel||"", x.hidden?1:0, x.bf?1:0, x.mt||0, +x.nights||0, +x.paid||0, x.paidCur||"", x.url||""]; });
  return "NIV1." + b64e(JSON.stringify(pack));
}

function copy(txt){
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){toast(t("tCodeCopied"))}).catch(fallback); }
  else fallback();
  function fallback(){ var el=$("outCode"); if(el){ el.select(); try{document.execCommand("copy"); toast(t("tCodeCopied"));}catch(e){toast(t("tSelectCopy"));} } }
}

/* renommer une personne PARTOUT (dépenses, chambres, remboursements, « je suis ») */
function renamePerson(old, nw){
  nw=(nw||"").trim();
  if(!nw || nw===old) return false;
  if(S.people.indexOf(nw)>=0){ toast(t("tAlreadyList")); return false; }
  S.people=S.people.map(function(p){ return p===old?nw:p; });
  if(S.me===old){ S.me=nw; lset("me",{name:nw}); }
  var now=Date.now();
  (S.expenses||[]).forEach(function(x){ var ch=false;
    if(x.who===old){ x.who=nw; ch=true; }
    if(x.split){
      if(x.split.among){ x.split.among=x.split.among.map(function(p){return p===old?nw:p;}); ch=true; }
      if(x.split.amounts && (old in x.split.amounts)){ x.split.amounts[nw]=x.split.amounts[old]; delete x.split.amounts[old]; ch=true; }
      if(x.split.shares && (old in x.split.shares)){ x.split.shares[nw]=x.split.shares[old]; delete x.split.shares[old]; ch=true; }
    }
    if(ch) x.mt=now;
  });
  (S.hotels||[]).forEach(function(h){ (h.rooms||[]).forEach(function(r){ if(r.paidBy===old) r.paidBy=nw; if(r.occupants) r.occupants=r.occupants.map(function(p){return p===old?nw:p;}); }); });
  (S.payments||[]).forEach(function(p){ if(p.from===old)p.from=nw; if(p.to===old)p.to=nw; });
  saveTrip().catch(function(){}); cacheTrip();
  return true;
}

  }

  function move(p, dir){ var i=S.people.indexOf(p), j=i+dir; if(i<0||j<0||j>=S.people.length) return; var tmp=S.people[i]; S.people[i]=S.people[j]; S.people[j]=tmp; draw(); }
  function setShares(p, n){ n=Math.max(1,Math.min(9,n)); S.partShares[p]=n; draw(); }
  $("plist").addEventListener("click", function(e){

    if(S.expenses.some(function(x){return x.who===p})){ toast(t("tHasExpenses")); return; }
    S.people=S.people.filter(function(x){return x!==p}); delete S.partShares[p]; draw();

  var add=function(){

/* ---- récap privé « qui rembourse qui » (protégé par code) ---- */
var settleUnlocked=false;
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* hachage du code (léger, non réversible) — stocké dans le carnet partagé pour verrouiller TOUS les téléphones */
function pinHashOf(v){ var h=5381, s="niv:"+v; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return h.toString(36); }
function setSharedPin(v){ S.pinHash=pinHashOf(v); S.pinAt=Date.now(); saveTrip().catch(function(){}); cacheTrip(); }
/* déverrouillage privé (code secret PARTAGÉ, synchronisé — même code sur tous les téléphones) */
function unlockPrivate(onOk){
  if(settleUnlocked){ onOk(); return; }
  // migration : ancien code local -> code partagé
  if(!S.pinHash){ var old=lget("settlePin"); if(old){ S.pinHash=pinHashOf(old); S.pinAt=Date.now(); localStorage.removeItem("settlePin"); saveTrip().catch(function(){}); cacheTrip(); } }
  if(!S.pinHash){
    openSheet('<h3>🔒</h3><p class="note" style="margin-bottom:12px">'+esc(t("settleSetHint"))+'</p>'+
      '<div class="field"><label>'+t("settleCode")+'</label><input id="stPin" type="password" inputmode="numeric" autocomplete="off"></div>'+
      '<button class="btn" id="stSave">'+t("settleSetBtn")+'</button>');
    $("stSave").addEventListener("click", function(){ var v=($("stPin").value||"").trim(); if(!v){ toast(t("tCodeEmpty")); return; } setSharedPin(v); settleUnlocked=true; onOk(); });
  } else {
    openSheet('<h3>🔒</h3><p class="note" style="margin-bottom:12px">'+esc(t("settleEnterHint"))+'</p>'+
      '<div class="field"><label>'+t("settleCode")+'</label><input id="stPin" type="password" inputmode="numeric" autocomplete="off"></div>'+
      '<button class="btn" id="stOpen">'+t("settleOpenBtn")+'</button>');
    $("stOpen").addEventListener("click", function(){ var v=($("stPin").value||"").trim(); if(pinHashOf(v)===S.pinHash){ settleUnlocked=true; onOk(); } else toast(t("settleWrong")); });
  }
}
/* récap privé « qui rembourse qui » */
function renderSettleList(){

  var mc=function(eur){ return nf(conv(eur,"EUR",C),EU.d)+" "+EU.s; };

  }).join("")+'</ul>';

/* FICHE D'UNE PERSONNE : chaque dépense en détail (ligne par ligne), groupée par catégorie */
function openPersonDetail(name){
  var all=EXP(), C=S.expCur, EU=CUR[C]||CUR.EUR, me=(name===S.me);
  var mc=function(eur){ return nf(conv(eur,"EUR",C),EU.d)+" "+EU.s; };
  var cc=color(name);
  // données par catégorie pour une personne (mode "paid" = ce qu'il a réglé · "share" = sa part)
  function catDataFor(pname, mode){
    var G={}, O=[], tot=0;
    all.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(x){
      var k=(x.cat&&CATMAP[x.cat])?x.cat:"other";
      var v = (mode==="paid") ? (x.who===pname?x.eur:0) : owedShare(x,pname);
      if(v>0.005){ if(!G[k]){ G[k]={sum:0, items:[]}; O.push(k); } G[k].sum+=v; G[k].items.push({x:x, v:v}); tot+=v; }
    });
    return {order:O, groups:G, tot:tot};
  }
  // rendu des blocs par catégorie (chaque hôtel dans sa case), couleur = ccColor
  function renderCatBlocks(order, groups, ccColor){
    order.sort(function(a,b){ return groups[b].sum-groups[a].sum; });
    return order.map(function(k){
      var g=groups[k], body;
      if(k==="hotel"){
        var hg={}, ho=[];
        g.items.forEach(function(it){ var hk=hotelKey(it.x)||"?"; if(!hg[hk]){ hg[hk]={sum:0, items:[], ts:it.x.ts||0, hidden:true, bf:false, nights:+it.x.nights||0}; ho.push(hk); } var G2=hg[hk]; G2.items.push(it); G2.sum+=it.v; if(!it.x.hidden) G2.hidden=false; if(it.x.bf) G2.bf=true; if((+it.x.nights||0)>G2.nights) G2.nights=+it.x.nights||0; if((it.x.ts||0)&&(!G2.ts||it.x.ts<G2.ts)) G2.ts=it.x.ts; });
        ho.sort(function(a,b){ return (hg[a].ts||8e15)-(hg[b].ts||8e15); });
        body=ho.map(function(hk){
          var G2=hg[hk], dstr=G2.ts?new Date(G2.ts).toLocaleDateString(locale(),{day:"2-digit",month:"short"}):"";
          var htitle=G2.hidden?("🎁 "+t("hotelSurprise")):esc(hk);
          var sub=[dstr, G2.nights?nightsLabel(G2.nights):"", G2.bf?"🥐":""].filter(Boolean).join(" · ");
          var head='<div style="display:flex;align-items:center;gap:8px;padding:0 0 5px"><span style="flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+htitle+'</span>'+(sub?'<small style="color:var(--muted);flex:none">'+esc(sub)+'</small>':'')+'<b style="font-size:13px;font-variant-numeric:tabular-nums;flex:none">'+mc(G2.sum)+'</b></div>';
          var rl = G2.items.length>1 ? G2.items.map(function(it){
            var lbl=(!it.x.hidden && it.x.label)?esc(it.x.label):"🛏️";
            return '<div style="display:flex;gap:8px;padding:3px 0 3px 6px;font-size:12px;color:var(--muted)"><span style="flex:1">'+lbl+'</span><b style="color:var(--text);font-variant-numeric:tabular-nums">'+mc(it.v)+'</b></div>';
          }).join("") : "";
          return '<div style="border:1px solid var(--line);border-left:3px solid '+ccColor+';border-radius:10px;padding:9px 11px;margin:0 0 8px;background:var(--slab2)">'+head+rl+'</div>';
        }).join("");
      } else {
        body=g.items.map(function(it){
          var x=it.x, d=x.ts?new Date(x.ts).toLocaleDateString(locale(),{day:"2-digit",month:"short"}):"";
          return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0 6px 30px;border-bottom:1px solid var(--line2)">'+
            '<div style="flex:1;min-width:0"><div style="font-size:13px">'+esc(displayLabel(x))+'</div>'+
              '<div style="font-size:11px;color:var(--muted);margin-top:1px">'+(d?d+" · ":"")+t("pdBy")+" "+esc(x.who)+'</div></div>'+
            '<b style="font-size:13px;font-variant-numeric:tabular-nums;flex:none">'+mc(it.v)+'</b></div>';
        }).join("");
      }
      return '<div style="margin-bottom:10px">'+
        '<div style="display:flex;align-items:center;gap:8px;padding:8px 0 6px;border-bottom:2px solid '+ccColor+';margin-bottom:8px">'+
          '<span style="font-size:16px;width:22px;text-align:center;flex:none">'+catIcon(k)+'</span>'+
          '<span style="flex:1;font-weight:700;font-size:14px">'+esc(catLabel(k))+'</span>'+
          '<b style="font-size:14px;font-variant-numeric:tabular-nums">'+mc(g.sum)+'</b></div>'+
        body+'</div>';
    }).join("");
  }
  function block(data, title, hint){
    if(!data.order.length) return "";
    return '<h2 class="sec" style="margin:14px 0 2px">'+title+'</h2>'+
      (hint?'<p class="note" style="margin:0 0 6px">'+esc(hint)+'</p>':'')+
      renderCatBlocks(data.order, data.groups, cc)+
      '<div style="display:flex;align-items:center;gap:8px;padding:6px 0 2px"><span style="flex:1;font-size:12.5px;font-weight:700;color:var(--muted)">TOTAL</span><b style="font-size:16px;font-variant-numeric:tabular-nums">'+mc(data.tot)+'</b></div>';
  }
  var paidData=catDataFor(name,"paid"), shareData=catDataFor(name,"share");
  var paidTot=paidData.tot, shareTot=shareData.tot;
  var adj=(paymentAdj()[name]||0);
  var net=paidTot-shareTot+adj;           // >0 : on lui doit · <0 : il doit
  var secPaid  = block(paidData,  me?t("pdPaidTitle"):t("pdPaidTitleO"), "");
  var secShare = block(shareData, me?t("pdShareMine"):t("pdShareOther"), me?t("pdShareHint"):t("pdShareHintO"));
  // 3) qui doit à qui — AVEC le détail de chaque personne (pourquoi il doit : hôtel, chauffeur, taxi…)
  // RÈGLE (demande de la gérante) : une fiche ne montre QUE la personne ouverte — jamais le détail
  // ni les montants des autres. SEULE EXCEPTION : la fiche de la gérante (1er participant, sur SON
  // téléphone) garde le détail de chaque personne qui lui doit de l'argent (pourquoi elle doit).
  var full = me && S.people.indexOf(name)===0;
  var trans=settlements().filter(function(o){ return o.from===name || o.to===name; });
  var transHtml="";
  if(trans.length){
    var incoming=trans.filter(function(o){return o.to===name;}).length>0;
    transHtml='<h2 class="sec" style="margin:14px 0 4px">'+(incoming?t("pdWhoOwes"):t("pdWhoIOwe"))+'</h2>'+
      trans.map(function(o){
        var mine=(o.to===name);
        if(!full){   // fiche d'une autre personne : une ligne simple, rien sur les autres
          return '<div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2)">'+
            '<span style="flex:1;font-size:13.5px">'+fmt(t("settleOwes"),{a:esc(o.from), b:esc(o.to), x:'<b style="color:'+(mine?"var(--aqua)":"var(--rose)")+';font-variant-numeric:tabular-nums">'+mc(o.amount)+'</b>'})+'</span></div>';
        }
        // fiche de la gérante : détail complet du DÉBITEUR (ce qu'il a consommé explique la somme)
        var other=(o.to===name)?o.from:o.to, oc=color(other);
        var debtor=o.from, dc=color(debtor);
        var od=catDataFor(debtor,"share");
        var detail=renderCatBlocks(od.order, od.groups, dc);
        var dPaid=0; EXP().forEach(function(x){ if(x.who===debtor) dPaid+=x.eur; });
        var dAdj=(paymentAdj()[debtor]||0);
        var l2=function(lbl,val,col){ return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0"><span style="flex:1;font-size:12.5px;color:var(--muted)">'+esc(lbl)+'</span><b style="font-size:13px;font-variant-numeric:tabular-nums'+(col?';color:'+col:'')+'">'+val+'</b></div>'; };
        var recap=l2(fmt(t("pdConsumed"),{name:debtor}), mc(od.tot));
        if(dPaid>0.005) recap+=l2(t("pdAlreadyPaid"), "−"+mc(dPaid), "var(--aqua)");
        if(dAdj>0.005)  recap+=l2(t("pdAlreadyReimb"), "−"+mc(dAdj), "var(--aqua)");
        recap+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0 2px;border-top:2px solid var(--line)"><span style="flex:1;font-size:13px;font-weight:700;color:var(--muted)">'+t("pdRemains")+'</span><b style="font-size:15px;font-variant-numeric:tabular-nums;color:'+(mine?"var(--aqua)":"var(--rose)")+'">'+mc(o.amount)+'</b></div>';

/* détail par personne : ce que chacun doit, par catégorie (dépenses payées par les autres) */
function personCatDetail(){
  var all=EXP(), adj=paymentAdj(), res={}, names={};
  S.people.forEach(function(p){names[p]=1;});
  all.forEach(function(x){ if(x.who) names[x.who]=1; });
  Object.keys(names).forEach(function(p){ res[p]={cats:{}, owes:0, advanced:0, adj:adj[p]||0}; });
  all.forEach(function(x){
    var k=(x.cat&&CATMAP[x.cat])?x.cat:"other";
    Object.keys(res).forEach(function(p){
      var sh=owedShare(x,p);
      if(x.who===p){ res[p].advanced += x.eur - sh; }
      else if(sh>0.005){ res[p].cats[k]=(res[p].cats[k]||0)+sh; res[p].owes+=sh; }
    });
  });
  return res;
}
/* créditeur principal (celui qui a le plus avancé) — c'est lui qu'on rembourse */

}

/* regroupe les dépenses "hôtel" par hôtel, trié arrivée puis départ */
function hotelGroups(){
  var hx=S.expenses.filter(function(x){ return x.cat==="hotel"; });
  var groups={}, order=[];
  hx.forEach(function(x){ var k=hotelKey(x); if(!groups[k]){ groups[k]={key:k, exps:[], sum:0, hidden:true, ts:x.ts||0, bf:false, nights:0, paid:0, paidCur:"EUR", url:""}; order.push(k); } var g=groups[k]; g.exps.push(x); g.sum+=x.eur; if(!x.hidden) g.hidden=false; if(x.bf) g.bf=true; if((+x.nights||0)>g.nights) g.nights=+x.nights||0; if((x.ts||0) && (!g.ts || x.ts<g.ts)) g.ts=x.ts; if((+x.paid||0)>0 && !(g.paid>0)){ g.paid=+x.paid; g.paidCur=x.paidCur||"EUR"; } if(x.url && !g.url) g.url=x.url; });
  order.sort(function(a,b){ var A=groups[a], B=groups[b];   // 1) jour d'arrivée  2) jour de départ
    var d=(A.ts||8e15)-(B.ts||8e15); if(d) return d;
    return ((A.ts||0)+(A.nights||0)*86400000)-((B.ts||0)+(B.nights||0)*86400000); });
  return {groups:groups, order:order};
}
/* ALIGNEMENT AUTOMATIQUE : pour chaque hôtel qui a un « prix réel payé », les chambres déjà
   enregistrées sont remises en proportion pour que leur total = ce prix (aucune retape à faire).
   Tourne à chaque chargement / synchro ; ne touche à rien si le total colle déjà (< 0,5 ct).
   Si les chambres sont dans la devise du paiement (ex. tout en ₹) : montants natifs conservés
   en proportion, seul l'équivalent € est recalé. Renvoie true si quelque chose a changé. */
function alignHotelsToPaid(){
  var G=hotelGroups(), changed=false, now=Date.now();
  G.order.forEach(function(k){
    var g=G.groups[k]; if(!(g.paid>0)) return;
    var pc=g.paidCur||"EUR", target=conv(g.paid,pc,"EUR");
    var rooms=g.exps.filter(function(x){ return (+x.amount||0)>0; }); if(!rooms.length || !(target>0)) return;
    var sumEur=0; rooms.forEach(function(x){ sumEur+=(+x.eur||0); });
    if(Math.abs(sumEur-target)<0.005) return;
    var native=rooms.every(function(x){ return (x.cur||"EUR")===pc; });
    var tot=0; rooms.forEach(function(x){ tot+= native? +x.amount : +x.eur; });
    if(!(tot>0)) return;
    var whole = native? g.paid : target, acc=0;
    rooms.forEach(function(x,i){
      var c=x.cur||"EUR", d=CUR[c]?CUR[c].d:2, m=Math.pow(10,d);
      var share=(native? +x.amount : +x.eur)*whole/tot, amt, eur;
      if(native){ amt=Math.round(share*m)/m; eur=Math.round(conv(amt,pc,"EUR")*100)/100; }
      else { eur=Math.round(share*100)/100; amt=Math.round(conv(eur,"EUR",c)*m)/m; }
      if(i===rooms.length-1){ eur=Math.round((target-acc)*100)/100; if(!native) amt=Math.round(conv(eur,"EUR",c)*m)/m; }
      acc+=eur;
      if(Math.abs(amt-(+x.amount))>1e-9 || Math.abs(eur-(+x.eur))>1e-9){ x.amount=amt; x.eur=eur; x.mt=now; changed=true; }
    });
  });
  return changed;
}
/* LISTE des hôtels (privé) : chaque hôtel à part, trié par date, avec ses chambres/prix modifiables */
function showHotels(){
  var G=hotelGroups(), groups=G.groups, order=G.order;

/* ENVOYER UN HÔTEL À LA FAMILLE (WhatsApp) — le message est écrit dans la langue choisie
   (français, anglais, tamoul), quelle que soit la langue de l'appli. Aucun prix n'est envoyé. */
function hotelShareText(g, lang){
  var saved=LANG; LANG=(lang && I18N[lang]) ? lang : LANG;
  var L=[];
  try{
    var sub=[stayRange(g.ts,g.nights), g.nights?nightsLabel(g.nights):""].filter(Boolean).join(" · ");
    L.push("🏨 "+g.key);
    if(sub) L.push("📅 "+sub);
    L.push(g.bf ? t("bfInc") : ("🚫 "+t("bfNone")));
    if(g.url) L.push("🔗 "+g.url);
  } finally { LANG=saved; }
  return L.join("\n");
}

    '<div class="note" style="margin:6px 2px 6px;font-weight:600;color:var(--text)">'+t("hdRooms")+'</div>'+
    '<div id="hRooms"></div>'+
    '<button class="btn ghost" id="hrAdd" style="font-size:13px;padding:11px">'+t("addRoom")+'</button>'+
    '<button class="btn" id="hSave" style="margin-top:10px">'+t("saveWord")+'</button>'+
    (key?'<button class="btn ghost" id="hDel" style="margin-top:8px;color:var(--rose);font-size:13px;padding:11px">'+t("hdDelHotel")+'</button>':''));
  function updN(){ var n=nightsBetween($("hIn").value,$("hOut").value); $("hN").textContent=n?"🌙 "+nightsLabel(n):""; }
  $("hIn").addEventListener("change", function(){ if($("hIn").value&&!$("hOut").value){ var d=new Date($("hIn").value+"T12:00:00"); d.setDate(d.getDate()+1); $("hOut").value=d.toISOString().slice(0,10);} updN(); });
  $("hOut").addEventListener("change", updN); updN();
  $("hPaidCur").value=paidCur0;
  $("hBf").addEventListener("click", function(){ bfOn=!bfOn; this.setAttribute("aria-pressed", bfOn?"true":"false"); });
  $("hVis").addEventListener("click", function(){ visOn=!visOn; this.setAttribute("aria-pressed", visOn?"true":"false"); });
  /* sous chaque chambre : la part de chaque occupant (prix ÷ occupants) */
  function shareText(rm){
    var c=rm.cur, sy=CUR[c]?CUR[c].s:c, dd=CUR[c]?CUR[c].d:2;
    var price=pf(rm.price), occ=S.people.filter(function(p){return rm.occ[p];});
    if(!(price>0)||!occ.length) return "";
    return occ.map(function(p){ return esc(p)+" <b style=\"color:var(--text)\">"+nf(price/occ.length,dd)+" "+sy+"</b>"; }).join(" · ");
  }
  function upShare(i){ var el=$("hRooms").querySelector('.hrShare[data-i="'+i+'"]'); if(el) el.innerHTML=shareText(rooms[i]); }
  function drawR(){
    $("hRooms").innerHTML=rooms.map(function(rm,i){
      return '<div class="field" style="border:1px solid var(--line);border-radius:12px;padding:10px 12px">'+
        '<div class="note" style="margin:0 0 6px;font-weight:600;color:var(--text)">'+t("roomWord")+' '+(i+1)+'</div>'+
        '<div class="row2" style="margin:0 0 8px"><input class="hrPrice" data-i="'+i+'" inputmode="decimal" placeholder="'+esc(t("roomPrice"))+'" value="'+esc(rm.price)+'"><select class="hrCur" data-i="'+i+'">'+curOpts+'</select></div>'+
        '<div class="note" style="margin:0 0 4px">'+t("hdWho")+'</div><div class="who hrWho" data-i="'+i+'">'+S.people.map(function(p){return '<button type="button" data-p="'+esc(p)+'" aria-pressed="'+(rm.occ[p]?"true":"false")+'">'+esc(p)+'</button>';}).join("")+'</div>'+
        '<div class="note" style="margin:8px 0 4px">'+t("hdPaidBy")+'</div><div class="who hrPaid" data-i="'+i+'">'+S.people.map(function(p){return '<button type="button" data-p="'+esc(p)+'" aria-pressed="'+(p===rm.paidBy)+'">'+esc(p)+'</button>';}).join("")+'</div>'+
        '<div class="note hrShare" data-i="'+i+'" style="margin:10px 0 0;color:var(--aqua)"></div>'+
        (rooms.length>1?'<button type="button" class="btn ghost hrDel" data-i="'+i+'" style="margin-top:8px;font-size:12px;padding:8px">✕ '+t("roomWord")+'</button>':'')+
      '</div>';
    }).join("");
    [].forEach.call($("hRooms").querySelectorAll(".hrCur"), function(sel){ sel.value=rooms[+sel.dataset.i].cur; });
    rooms.forEach(function(_,i){ upShare(i); });
  }
  drawR();
  $("hRooms").addEventListener("input", function(e){
    var pr=e.target.closest(".hrPrice"); if(pr){ rooms[+pr.dataset.i].price=pr.value; base=null; upShare(+pr.dataset.i); }
  });
  $("hRooms").addEventListener("change", function(e){ if(e.target.classList.contains("hrCur")){ var i=+e.target.dataset.i; rooms[i].cur=e.target.value; base=null; drawR(); } });
  /* PRIX RÉEL PAYÉ modifié -> les chambres se recalculent AUTOMATIQUEMENT en proportion
     pour retomber exactement sur ce total (mêmes rapports entre chambres, arrondi absorbé
     par la dernière chambre). Si toutes les chambres sont vides : partage égal. */
  var base=null;   // rapports d'origine entre chambres (figés tant qu'on tape le total, pour éviter la dérive d'arrondi)
  function rescaleRooms(){
    var pc=$("hPaidCur").value, target=conv(pf($("hPaid").value), pc, "EUR");
    if(!(target>0) || !rooms.length) return;
    var dOf=function(c){ return CUR[c]?CUR[c].d:2; };
    var rnd=function(v,d){ var m=Math.pow(10,d); return Math.round(v*m)/m; };
    var fmtP=function(v,d){ return rnd(v,d).toFixed(d).replace(".",","); };   // ex. 129,10 (pas 129,1)
    if(!base || base.length!==rooms.length) base=rooms.map(function(rm){ return {p:pf(rm.price), cur:rm.cur||"EUR"}; });
    var sumEur=0; base.forEach(function(b){ sumEur+=conv(b.p, b.cur, "EUR"); });
    var priced;
    if(sumEur>0){
      var f=target/sumEur;
      rooms.forEach(function(rm,i){ var p=base[i].p; if(p>0) rm.price=fmtP(conv(p*f, base[i].cur, rm.cur||"EUR"), dOf(rm.cur||"EUR")); });
      priced=rooms.filter(function(rm){ return pf(rm.price)>0; });
    } else {
      rooms.forEach(function(rm){ rm.price=fmtP(conv(target,"EUR",rm.cur||"EUR")/rooms.length, dOf(rm.cur||"EUR")); });
      priced=rooms.slice();
    }
    // résidu d'arrondi -> dernière chambre, pour que la somme = le total payé
    var s2=0; rooms.forEach(function(rm){ s2+=conv(pf(rm.price), rm.cur||"EUR", "EUR"); });
    var last=priced[priced.length-1];
    if(last){ var diff=target-s2; if(Math.abs(diff)>0.0001){ var np=pf(last.price)+conv(diff,"EUR",last.cur||"EUR"); last.price=fmtP(np, dOf(last.cur||"EUR")); } }
    drawR();
  }
  $("hPaid").addEventListener("input", rescaleRooms);
  $("hPaidCur").addEventListener("change", rescaleRooms);
  $("hRooms").addEventListener("click", function(e){
    var pd=e.target.closest(".hrPaid button[data-p]"); if(pd){ var i=+pd.parentNode.dataset.i; rooms[i].paidBy=pd.dataset.p; [].forEach.call(pd.parentNode.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===pd);}); return; }
    var wh=e.target.closest(".hrWho button[data-p]"); if(wh){ var j=+wh.parentNode.dataset.i,p=wh.dataset.p; rooms[j].occ[p]=!rooms[j].occ[p]; wh.setAttribute("aria-pressed",rooms[j].occ[p]?"true":"false"); upShare(j); return; }

  $("hrAdd").addEventListener("click", function(){ rooms.push({id:newId(), price:"", cur:"EUR", paidBy:(S.me||S.people[0]), occ:{}}); base=null; drawR(); });
  $("hBack").addEventListener("click", showHotels);
  var del=$("hDel"); if(del) del.addEventListener("click", function(){

    origIds.forEach(function(id){ var ex=S.expenses.filter(function(x){return x.id===id;})[0]; if(ex) trashExpense(ex); else if(S.deleted.indexOf(id)<0) S.deleted.push(id); });   // -> corbeille
    saveHotels(); showHotels();
  });
  $("hSave").addEventListener("click", function(){
    var nm=($("hName").value||"").trim(); if(!nm){ toast(t("hotelName")); return; }
    var stay=$("hIn").value? new Date($("hIn").value+"T12:00:00").getTime() : (g&&g.ts?g.ts:Date.now());
    var nn=nightsBetween($("hIn").value,$("hOut").value);
    var bfv=bfOn, hid=!visOn, now=Date.now();
    var paidAmt=pf($("hPaid").value), paidCur=$("hPaidCur").value;   // prix réel payé (facultatif)
    var hurl=($("hUrl").value||"").trim(); if(hurl && !/^https?:\/\//i.test(hurl)) hurl="https://"+hurl;   // lien de l'hôtel (visible par tout le monde)
    var multi=rooms.filter(function(rm){return pf(rm.price)>0;}).length>1;
    var kept={}, made=0;
    rooms.forEach(function(rm){
      var price=pf(rm.price); if(price<=0) return;
      var occ=S.people.filter(function(p){return rm.occ[p];}); if(!occ.length) occ=S.people.slice();
      kept[rm.id]=1; made++;
      var data={ hotel:nm, label:(multi?(t("roomWord")+" "+made):""), amount:price, cur:rm.cur, eur:conv(price,rm.cur,"EUR"), cat:"hotel", who:rm.paidBy, split:{mode:"equal", among:occ}, ts:stay, nights:nn, bf:bfv, hidden:hid, paid:(paidAmt>0?paidAmt:0), paidCur:(paidAmt>0?paidCur:""), url:hurl, mt:now };
      var ex=S.expenses.filter(function(x){return x.id===rm.id;})[0];
      if(ex){ for(var kk in data) ex[kk]=data[kk]; } else { data.id=rm.id; S.expenses.push(data); }
    });
    origIds.forEach(function(id){ if(!kept[id]){ var ex=S.expenses.filter(function(x){return x.id===id;})[0]; if(ex) trashExpense(ex); else if(S.deleted.indexOf(id)<0) S.deleted.push(id); } });   // -> corbeille
    if(!made){ toast(t("roomsNeed")); return; }
    saveHotels(); showHotels();
  });
}

/* ---- chauffeur : ajoute une dépense (course, péages, essence…) dans la catégorie Chauffeur ---- */
/* ---- chauffeur : calculateur forfait jour + forfait km/jour (+ supplément), × nb de jours ---- */
function openDriver(exp){
  if(S.locked){ toast(t("tAccountsLocked")); return; }
  if(!S.people.length){ return openPeople(true); }
  // ancien chauffeur sans détail : on remet le total dans « supplément » pour ne rien perdre, et tu peux le restructurer
  var dp=(exp&&exp.dp) || (exp?{d:0,a:0,b:0,s:+exp.amount||0}:{}), payer=(exp&&exp.who)||S.me||S.people[0];
  var curSel=(exp&&exp.cur)||(S.a!=="EUR"?S.a:"EUR");
  var curOpts=Object.keys(CUR).map(function(c){return '<option value="'+c+'"'+(c===curSel?' selected':'')+'>'+c+' '+CUR[c].s+'</option>';}).join("");
  var vd=dp.d?String(dp.d):"", va=dp.a?String(dp.a):"", vb=dp.b?String(dp.b):"", vs=dp.s?String(dp.s):"";
  openSheet('<h3>🚗 '+t("driverBtnLbl")+'</h3>'+
    '<div class="field"><label>'+t("chooseCurrency")+'</label><select id="dCur">'+curOpts+'</select></div>'+
    '<div class="field"><label>'+t("drvDays")+'</label><input id="dDays" inputmode="numeric" placeholder="0" value="'+esc(vd)+'" autocomplete="off"></div>'+
    '<div class="field"><label>'+t("drvPerDay")+'</label><input id="dDay" inputmode="decimal" placeholder="0" value="'+esc(va)+'" autocomplete="off"></div>'+
    '<div class="field"><label>'+t("drvKmPerDay")+'</label><input id="dKm" inputmode="decimal" placeholder="0" value="'+esc(vb)+'" autocomplete="off"></div>'+
    '<div class="field"><label>'+t("drvExtra")+'</label><input id="dExtra" inputmode="decimal" placeholder="0" value="'+esc(vs)+'" autocomplete="off"></div>'+
    '<div class="field"><label>'+t("drvPaidBy")+'</label><div class="who" id="dPaid">'+S.people.map(function(p){return '<button type="button" data-p="'+esc(p)+'" aria-pressed="'+(p===payer)+'">'+esc(p)+'</button>';}).join("")+'</div></div>'+
    '<p class="note" id="dTot" style="margin:2px 2px 10px;font-weight:700;color:var(--gold)"></p>'+
    '<button class="btn" id="dAdd">'+(exp?t("saveWord"):t("drvAdd"))+'</button>'+
    (exp?'<button class="btn ghost" id="dDel" style="margin-top:8px;color:var(--rose);font-size:13px;padding:11px">✕ '+t("drvDelete")+'</button>':'')+
    '<button class="btn ghost" id="dOther" style="margin-top:8px;font-size:13px;padding:11px">'+t("drvOther")+'</button>');
  $("dPaid").addEventListener("click", function(e){ var b=e.target.closest("button[data-p]"); if(!b) return; payer=b.dataset.p; [].forEach.call(this.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b);}); });
  function calc(){ var d=parseInt($("dDays").value,10)||0, a=pf($("dDay").value), b=pf($("dKm").value), s=pf($("dExtra").value); return d*(a+b)+s; }
  function upd(){ var c=$("dCur").value, sy=CUR[c]?CUR[c].s:c, dd=CUR[c]?CUR[c].d:2, tot=calc();
    $("dTot").textContent = tot>0 ? (t("drvTotal")+" : "+nf(tot,dd)+" "+sy+(c!=="EUR"?" (≈ "+nf(conv(tot,c,"EUR"),2)+" €)":"")) : ""; }
  ["dDays","dDay","dKm","dExtra"].forEach(function(id){ $(id).addEventListener("input", upd); });
  $("dCur").addEventListener("change", upd); upd();
  $("dAdd").addEventListener("click", function(){
    var c=$("dCur").value, tot=calc(), d=parseInt($("dDays").value,10)||0, a=pf($("dDay").value), b=pf($("dKm").value), s=pf($("dExtra").value);
    if(tot<=0){ toast(t("tIndicateAmount")); return; }
    // si NI le total NI la devise n'ont changé, on garde la valeur en € d'origine
    // (sinon un simple réenregistrement la recalculerait au taux fixe actuel)
    var sameMoney = exp && Math.abs(tot-(+exp.amount||0))<1e-9 && c===(exp.cur||"EUR") && (+exp.eur>0);
    var data={ who:payer, label:fmt(t("drvLabel"),{n:d}), amount:tot, cur:c,
               eur: sameMoney ? +exp.eur : conv(tot,c,"EUR"), cat:"driver", dp:{d:d,a:a,b:b,s:s}, mt:Date.now() };
    if(exp){ for(var k in data) exp[k]=data[k]; }
    else { data.id=String(Date.now())+Math.random().toString(36).slice(2,6); data.ts=Date.now(); data.split={mode:"equal", among:[]}; S.expenses.push(data); }
    closeSheet(); renderExp(); pullThenSave();
  });
  var od=$("dOther"); if(od) od.addEventListener("click", function(){ openAddExpense({cat:"driver"}); });
  var dd2=$("dDel"); if(dd2) dd2.addEventListener("click", function(){
    if(!confirm(t("confirmDelete").replace("{l}",exp.label||""))) return;
    var curX=S.expenses.filter(function(y){return y.id===exp.id;})[0]||exp;
    trashExpense(curX);                                             // -> corbeille (restaurable)
    closeSheet(); renderExp(); pullThenSave();
  });
}
/* Le bouton « Chauffeur du circuit » ouvre DIRECTEMENT le chauffeur déjà enregistré
   (pour le modifier ou le supprimer, sans avoir à le chercher dans l'historique).
   S'il n'y en a pas encore, il ouvre la création. */
$("driverBtn").addEventListener("click", function(){
  var drv=(S.expenses||[]).filter(function(x){ return x.cat==="driver"; })
                          .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  openDriver(drv.length ? drv[0] : null);
});

/* ---- QR code : installer l'app sur un autre téléphone ---- */
function openQR(){
  openSheet('<h3>'+t("installTitle")+'</h3>'+
    '<p class="note" style="margin-bottom:12px">'+t("installIntro")+'</p>'+
    '<div style="background:#fff; border-radius:16px; padding:16px; display:flex; justify-content:center"><img src="qr.png" alt="QR code" style="width:230px; height:230px; image-rendering:pixelated"></div>'+
    '<p class="note" style="text-align:center; margin-top:10px"><b style="color:var(--text)">'+esc(location.host)+'</b></p>'+
    '<button class="btn" id="qrShare" style="margin-top:12px">'+t("shareLink")+'</button>');
  $("qrShare").addEventListener("click", function(){
    var link = location.origin + "/";
    if(navigator.share){ navigator.share({title:"Voyage Inde", url:link}).catch(function(){}); }
    else { copy(link); toast("Lien copié"); }
  });
}
$("qrBtn").addEventListener("click", openQR);

/* ---- choix de la langue ---- */
function openLang(){

function planDone(){ return lget("planDone")||{}; }
function pad2(x){ x=String(x); return x.length<2 ? "0"+x : x; }
function renderPlan(){
  var el=$("planBody"); if(!el) return;
  var done=planDone();
  var doneCount=PLAN.days.filter(function(d){return done[d.n];}).length;
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var iso=t0.getFullYear()+"-"+pad2(t0.getMonth()+1)+"-"+pad2(t0.getDate());
  var d1=new Date(2026,8,3), d19=new Date(2026,8,21);
  var todayBox="";
  if(t0<d1){ todayBox='<div class="ptoday">'+fmt(t("planCountdown"),{n:Math.round((d1-t0)/86400000)})+'</div>'; }
  else if(t0>d19){ todayBox='<div class="ptoday">'+t("planEnded")+'</div>'; }
  else { var cur=PLAN.days.filter(function(d){return d.date===iso;})[0];
    if(cur){ var CL=cur.L[LANG]||cur.L.fr; todayBox='<div class="ptoday"><b>'+t("planToday")+' · '+t("planDayWord")+' '+cur.n+'</b> — '+esc(CL.ttl)+'</div>'; } }
  var head='<div class="phead"><div class="t">'+t("planHeaderTitle")+'</div><div class="dt">'+t("planHeaderDates")+'</div>'+todayBox+
    '<div class="pbar"><i style="width:'+(doneCount/PLAN.days.length*100)+'%"></i></div>'+
    '<div class="dt" style="margin-top:6px">'+fmt(t("planProgress"),{done:doneCount, tot:PLAN.days.length})+'</div></div>';
  var HG=hotelGroups();
  /* l'hôtel d'une étape = celui dont le séjour CHEVAUCHE le plus les nuits de l'étape
     (marche même si l'hôtel est pris la veille, ex. arrivée de nuit : 3→7 pour une étape 4→7) */
  function hotelForStage(s){
    if(!s.d) return null;
    var start=new Date(s.d+"T12:00:00").getTime(), end=start+(s.nights||1)*86400000;
    var best=null, bestOv=0;
    HG.order.forEach(function(k){
      var g=HG.groups[k]; if(!g.ts) return;
      var hEnd=g.ts+((+g.nights||1)*86400000);
      var ov=Math.min(end,hEnd)-Math.max(start,g.ts);
      if(ov>bestOv){ bestOv=ov; best=g; }
    });
    return bestOv>0 ? best : null;
  }
  var ov='<h2 class="sec">'+t("planOverview")+'</h2><ul class="pover">'+PLAN.stages.map(function(s){
    var nn=s.nights>1 ? fmt(t("planNights"),{n:s.nights}) : t("planNight1");
    var g=hotelForStage(s);
    // hôtel masqué : rien n'apparaît. Sinon : nom + lien cliquable (tout le monde peut voir l'hôtel)
    var hb=(g && !g.hidden) ? '<small style="color:var(--gold);display:block;margin-top:2px">🏨 '+esc(g.key)+(g.bf?' · 🥐':'')+
        (g.url?' · <a href="'+esc(g.url)+'" target="_blank" rel="noopener" style="color:var(--aqua);text-decoration:underline">'+esc(t("hdSeeHotel"))+' ↗</a>':'')+'</small>' : '';
    return '<li><span class="pl">'+esc(s.place)+'<small>'+esc(s.dates[LANG]||s.dates.fr)+'</small>'+hb+'</span><span class="nn">'+nn+'</span></li>';
  }).join("")+'</ul>';
  var days='<h2 class="sec">'+t("planDayByDay")+'</h2>'+PLAN.days.map(function(d){
    var L=d.L[LANG]||d.L.fr;
    var dt=new Date(d.date+"T12:00:00").toLocaleDateString(locale(),{weekday:"short",day:"2-digit",month:"short"});
    var maps=(d.maps||[]).map(function(m){ return '<a class="pmap" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(m.q)+'">📍 '+esc(m.label)+'</a>'; }).join("");
    var drive=d.drive?('<span class="drive">🚗 '+esc(d.drive[LANG]||d.drive.fr)+'</span>'):"";
    var photo=PLAN.dayPhoto[d.n]?('<img class="pphoto" src="photos/'+PLAN.dayPhoto[d.n]+'.jpg" alt="" loading="lazy">'):"";
    return '<div class="pday'+(d.date===iso?' now':'')+'"><div class="top">'+
      '<button class="pchk'+(done[d.n]?' on':'')+'" data-day="'+d.n+'" aria-label="ok">'+(done[d.n]?'✓':'')+'</button>'+
      '<div class="dd"><div class="ttl">'+esc(L.ttl)+'</div>'+
      '<div class="date">'+t("planDayWord")+' '+d.n+' · '+dt+'</div>'+
      (drive?('<div>'+drive+'</div>'):'')+
      photo+
      '<div class="desc">'+esc(L.desc)+'</div>'+
      (maps?('<div>'+maps+'</div>'):'')+
      '</div></div></div>';
  }).join("");
  var legs='<h2 class="sec">'+t("planRoutes")+'</h2><ul class="plegs">'+PLAN.legs.map(function(g){
    return '<li><span>'+esc(g.from)+' → '+esc(g.to)+(g.km?' <span style="color:var(--muted)">'+esc(g.km)+'</span>':'')+'</span><span class="du">'+esc(g.dur)+'</span></li>';
  }).join("")+'</ul>';
  var tips='<h2 class="sec">'+t("planTips")+'</h2><ul class="ptips">'+PLAN.tips.map(function(x){ return '<li>'+esc(x[LANG]||x.fr)+'</li>'; }).join("")+'</ul>';
  el.innerHTML = head+ov+days+legs+tips+'<p class="pcredit">'+t("planCredits")+'</p>';
}
$("planBody").addEventListener("click", function(e){
  var b=e.target.closest(".pchk"); if(!b) return;
  var n=b.dataset.day, done=planDone();
  if(done[n]) delete done[n]; else done[n]=1;
  lset("planDone", done); renderPlan();
});

/* ---- carte réelle (Leaflet + OpenStreetMap) — hors ligne : marqueurs + trajet ---- */
var _map=null;
function currentDayN(){
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var diff=Math.round((t0-new Date(2026,8,3))/86400000);
  return (diff>=0 && diff<=18) ? diff+1 : 0;
}
function initMap(){
  if(_map || !window.L || !$("planMap")) return;
  try{
    _map=L.map("planMap", {scrollWheelZoom:false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:17, attribution:"© OpenStreetMap"}).addTo(_map);
    var cd=currentDayN(), latlngs=[];
    PLAN.map.forEach(function(p,i){
      latlngs.push([p.lat,p.lng]);
      var here=cd && p.days && p.days.indexOf(cd)>=0;
      var m=L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:'<div class="mk'+(here?" now":"")+'">'+(i+1)+'</div>', iconSize:[26,26], iconAnchor:[13,13]})}).addTo(_map);
      m.bindPopup('<b>'+p.name+'</b><br><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+" India")+'" target="_blank" rel="noopener">Google Maps</a>');
    });
    L.polyline(latlngs, {color:"#F0B429", weight:3, opacity:.9}).addTo(_map);
    _map.fitBounds(latlngs, {padding:[26,26]});
  }catch(e){ _map=null; }
}

function tab(which){
  $("scC").classList.toggle("on", which==="c");
  $("scD").classList.toggle("on", which==="d");
  $("scP").classList.toggle("on", which==="p");
  $("tabC").setAttribute("aria-selected", which==="c");
  $("tabD").setAttribute("aria-selected", which==="d");
  $("tabP").setAttribute("aria-selected", which==="p");
  if(which==="d") pullTrip().then(renderExp).catch(function(){});
  if(which==="p"){ renderPlan(); setTimeout(function(){ initMap(); if(_map) _map.invalidateSize(); }, 80); }
}
$("tabC").addEventListener("click", function(){ tab("c") });
$("tabD").addEventListener("click", function(){ tab("d") });
$("tabP").addEventListener("click", function(){ tab("p") });

document.addEventListener("keydown", function(e){
  if($("sheet").classList.contains("on")) return;
  if($("scC").classList.contains("on")){
    if(/^[0-9]$/.test(e.key)) key(e.key);
    else if(e.key===","||e.key===".") key(",");
    else if(e.key==="Backspace") key("del");
  }
});

  if(!all.some(function(x){return x.cat==="driver";})) A.push('<div class="note">'+esc(t("exportNoDriver"))+'</div>');
