<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #010b14;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, sans-serif;
  color: #00d4ff;
  /* Zone de drag pour la titlebar cachée */
  -webkit-app-region: drag;
}
.logo {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: 14px;
  text-shadow: 0 0 40px #00d4ff, 0 0 80px rgba(0,212,255,0.3);
  margin-bottom: 40px;
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { text-shadow: 0 0 30px #00d4ff; }
  50% { text-shadow: 0 0 60px #00d4ff, 0 0 100px rgba(0,212,255,0.4); }
}
.ring {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 2px solid rgba(0,212,255,0.2);
  border-top-color: #00d4ff;
  animation: spin 1s linear infinite;
  margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.status {
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(0,212,255,0.4);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
</style>
</head>
<body>
  <div class="logo">NIRO</div>
  <div class="ring"></div>
  <div class="status">Démarrage en cours…</div>
</body>
</html>
