<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIRO — Hors ligne</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #010b14;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, sans-serif;
  color: #00d4ff;
  text-align: center;
  padding: 30px;
}
.logo { font-size: 32px; font-weight: 800; letter-spacing: 12px; margin-bottom: 40px; opacity: 0.5; }
.icon { font-size: 48px; margin-bottom: 24px; }
h2 { font-size: 18px; letter-spacing: 2px; margin-bottom: 12px; color: rgba(0,212,255,0.7); }
p { font-size: 14px; color: rgba(0,212,255,0.35); line-height: 1.6; max-width: 300px; }
.retry {
  margin-top: 32px;
  padding: 12px 28px;
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 8px;
  background: none;
  color: rgba(0,212,255,0.6);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
}
.retry:hover { border-color: #00d4ff; color: #00d4ff; }
</style>
</head>
<body>
  <div class="logo">NIRO</div>
  <div class="icon">🔌</div>
  <h2>Mac Studio hors ligne</h2>
  <p>NIRO tourne sur votre Mac Studio.<br>
  Assurez-vous qu'il est allumé et connecté au même réseau.</p>
  <button class="retry" onclick="location.reload()">RÉESSAYER</button>
</body>
</html>
