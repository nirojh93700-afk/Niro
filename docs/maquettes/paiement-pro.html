<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Paiement (version pro, vrais logos)</title>
<style>
  :root{--gold:#c2a14e;--gold-dark:#a98935;--gold-l:#e2c67e;--cream:#faf6ef;--paper:#fffdf9;--ink:#2b2620;--ink-soft:#5a5247;--line:#e7ddcd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
  .demo{max-width:480px;margin:0 auto;padding:22px 16px 60px}
  .demo-note{background:#241a0c;color:#f3e8d3;border-radius:12px;padding:10px 16px;font-size:.85rem;margin-bottom:20px}
  .totbox{background:linear-gradient(135deg,#fbf4e6,#fffdf9);border:1px solid #e7d3a1;border-radius:14px;padding:11px 15px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .totbox .lab{font-weight:700}
  .totbox .val{font-size:1.35rem;font-weight:800;color:var(--gold-dark)}

  .klarna{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:.86rem}
  .klogo{background:#FFB3C7;color:#0b0b0b;font-weight:800;border-radius:7px;padding:3px 9px;font-size:.82rem;letter-spacing:.2px;flex:0 0 auto}
  .klarna b{color:#111}

  .row{display:flex;gap:10px}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .qty button{border:0;background:none;font-size:1.15rem;width:38px;height:46px;cursor:pointer}
  .qty span{min-width:24px;text-align:center;font-weight:700}
  .add{flex:1;border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#1a1206;font-weight:800;font-size:1rem;cursor:pointer;height:46px}

  .pays{margin-top:16px;text-align:center}
  .pays .lab{color:var(--ink-soft);font-size:.75rem;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:6px}
  .logos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .lg{background:#fff;border:1px solid #e7ddcd;border-radius:8px;height:34px;min-width:52px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .lg svg{display:block}
</style>
</head>
<body>
<div class="demo">
  <div class="demo-note">MAQUETTE — version PRO : vrais logos de paiement + mention Klarna adaptée au montant.</div>

  <div class="totbox"><span class="lab">Total tout compris</span><span class="val">57,80 €</span></div>

  <!-- Klarna : mention honnête (3x dès 50 €, sinon "plus tard") -->
  <div class="klarna">
    <span class="klogo">Klarna</span>
    <span>Payez en <b>3 fois sans frais</b> — 3× 19,27 €, ou plus tard</span>
  </div>

  <div class="row">
    <div class="qty"><button>−</button><span>1</span><button>+</button></div>
    <button class="add">Ajouter au panier</button>
  </div>

  <!-- Logos PRO -->
  <div class="pays">
    <div class="lab">🔒 Paiement 100 % sécurisé</div>
    <div class="logos">
      <!-- Visa -->
      <span class="lg"><svg width="40" height="14" viewBox="0 0 48 16"><text x="0" y="13" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" font-style="italic" fill="#1A1F71" letter-spacing="0.5">VISA</text></svg></span>
      <!-- Mastercard -->
      <span class="lg"><svg width="34" height="22" viewBox="0 0 34 22"><circle cx="13" cy="11" r="8" fill="#EB001B"/><circle cx="21" cy="11" r="8" fill="#F79E1B"/><path d="M17 4.8a8 8 0 0 0 0 12.4 8 8 0 0 0 0-12.4z" fill="#FF5F00"/></svg></span>
      <!-- CB -->
      <span class="lg"><svg width="30" height="16" viewBox="0 0 34 18"><rect width="34" height="18" rx="3" fill="#fff"/><text x="2" y="14" font-family="Arial" font-size="13" font-weight="800" fill="#2e7d32">C</text><text x="14" y="14" font-family="Arial" font-size="13" font-weight="800" fill="#1565c0">B</text></svg></span>
      <!-- PayPal -->
      <span class="lg"><svg width="54" height="15" viewBox="0 0 62 16"><text x="0" y="13" font-family="Arial" font-size="14" font-weight="800" font-style="italic" fill="#003087">Pay</text><text x="27" y="13" font-family="Arial" font-size="14" font-weight="800" font-style="italic" fill="#009CDE">Pal</text></svg></span>
      <!-- Apple Pay -->
      <span class="lg"><svg width="52" height="17" viewBox="0 0 56 18"><path fill="#000" d="M9.9 5.2c-.4.5-1 .9-1.7.8-.1-.7.2-1.4.6-1.9.4-.5 1.1-.9 1.7-.9.1.7-.2 1.4-.6 2zm.6 1c-.9 0-1.7.5-2.2.5-.5 0-1.2-.5-1.9-.5-1 0-1.9.6-2.4 1.4-1 1.8-.3 4.4.7 5.9.5.7 1.1 1.5 1.8 1.5.7 0 1-.5 1.9-.5.9 0 1.1.5 1.9.5.8 0 1.3-.7 1.7-1.4.6-.8.8-1.6.8-1.6 0 0-1.6-.6-1.6-2.4 0-1.5 1.2-2.2 1.3-2.3-.7-1-1.8-1.1-2.2-1.1z"/><text x="18" y="14" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#000">Pay</text></svg></span>
      <!-- Google Pay (logo officiel = "G Pay") -->
      <span class="lg"><svg width="46" height="16" viewBox="0 0 48 18"><text x="0" y="14" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#4285F4">G</text><text x="14" y="14" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5f6368">Pay</text></svg></span>
    </div>
  </div>

</div>
</body>
</html>
