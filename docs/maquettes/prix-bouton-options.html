<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Façons d'afficher le prix</title>
<style>
  :root{--gold:#c2a14e;--gold-dark:#a98935;--gold-l:#e2c67e;--cream:#faf6ef;--paper:#fffdf9;--ink:#2b2620;--ink-soft:#5a5247;--line:#e7ddcd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
  .demo{max-width:480px;margin:0 auto;padding:22px 16px 60px}
  .demo-note{background:#241a0c;color:#f3e8d3;border-radius:12px;padding:10px 16px;font-size:.85rem;margin-bottom:22px}
  .opt-block{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:20px}
  .opt-lab{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-bottom:12px}
  .opt-lab.reco{background:#256b34}
  .opt-lab.reco::after{content:" ✓ conseillé"}

  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .qty button{border:0;background:none;font-size:1.15rem;width:38px;height:46px;cursor:pointer;color:var(--ink)}
  .qty span{min-width:24px;text-align:center;font-weight:700}
  .add{border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#1a1206;font-weight:800;font-size:1rem;cursor:pointer;height:46px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px}
  .row{display:flex;gap:10px;align-items:stretch}
  .row .add{flex:1}
  .ap{background:rgba(26,18,6,.15);border-radius:999px;padding:3px 10px;font-size:.9rem}

  /* A : total sur le bouton */
  /* B : ligne total */
  .totline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .totline .lab{color:var(--ink-soft);font-size:.9rem}
  .totline .val{font-size:1.35rem;font-weight:800}
  .totline .u{font-size:.74rem;color:var(--ink-soft);font-weight:600;margin-left:5px}
  /* C : total encadré */
  .totbox{background:linear-gradient(135deg,#fbf4e6,#fffdf9);border:1px solid #e7d3a1;border-radius:14px;padding:11px 15px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .totbox .lab{font-weight:700}
  .totbox .val{font-size:1.35rem;font-weight:800;color:var(--gold-dark)}
</style>
</head>
<body>
<div class="demo">
  <div class="demo-note">MAQUETTE — 3 façons d'afficher le prix près du bouton « Ajouter au panier ». Dis-moi le numéro que tu préfères.</div>

  <div class="opt-block">
    <span class="opt-lab">Option 1 — sur le bouton (actuel)</span>
    <div class="row">
      <div class="qty"><button>−</button><span>1</span><button>+</button></div>
      <button class="add">Ajouter au panier <span class="ap">22,41 €</span></button>
    </div>
  </div>

  <div class="opt-block">
    <span class="opt-lab reco">Option 2 — ligne « Total » au-dessus</span>
    <div class="totline"><span class="lab">Total</span><span class="val">22,41 €<span class="u">tout compris</span></span></div>
    <div class="row">
      <div class="qty"><button>−</button><span>1</span><button>+</button></div>
      <button class="add">Ajouter au panier</button>
    </div>
  </div>

  <div class="opt-block">
    <span class="opt-lab">Option 3 — total dans un encadré doré</span>
    <div class="totbox"><span class="lab">Total tout compris</span><span class="val">22,41 €</span></div>
    <div class="row">
      <div class="qty"><button>−</button><span>1</span><button>+</button></div>
      <button class="add">Ajouter au panier</button>
    </div>
  </div>

</div>
</body>
</html>
